<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vaultis — Gestão Financeira Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Paleta Vaultis DARK: obsidiana + ouro antigo + camadas escuras ── */
  --obsidian: #07090C;       /* mais escuro — usado em hero/destaque máximo */
  --obsidian2: #0B0E13;
  --obsidian3: #11151B;
  --ink: #E8E4D8;            /* tipografia principal — invertida (off-white quente) */
  --ink2: #C2BFB5;
  --ink3: #97948B;

  /* ── Camadas de fundo (sobreposições) ── */
  --paper: #0E1117;          /* camada 0: fundo principal */
  --paper2: #131720;
  --paper3: #161B25;
  --card: #161B23;           /* camada 1: cards ficam ligeiramente acima do paper */
  --tint: #1C2230;           /* camada 2: hover, zonas de acento */
  --line: rgba(255,255,255,.06);  /* divisores sutis tipo "linha de luz" */
  --line2: rgba(255,255,255,.10);
  --ash: #1C2230;

  /* ── Acentos ── */
  --gold: #C9962A;           /* dourado um pouco mais saturado para brilhar no escuro */
  --gold2: #E0B655;
  --gold3: #F2D38A;
  --gold-dim: #9C7420;
  --gold-lt: rgba(201,150,42,.12);
  --champ2: #E0B655;
  --champ-dim: #9C7420;
  --champ-lt: rgba(201,150,42,.12);
  --champagne: #C9962A;

  --sage: #6DB09A;
  --sage-lt: rgba(109,176,154,.12);
  --slate: #6DB09A;
  --slate-lt: rgba(109,176,154,.12);

  --pos: #6DB09A;            /* verde sálvia mais claro/visível no escuro */
  --neg: #C47070;            /* vermelho quente — legível em fundo escuro */
  --pos-lt: rgba(109,176,154,.14);
  --neg-lt: rgba(196,112,112,.14);

  --txt: #E8E4D8;
  --muted: #8A8E96;
  --muted2: #5E6168;

  /* ── Sombras adaptadas para dark (uso de bordas sutis + gradiente de luz) ── */
  --shadow-xs: 0 1px 0 rgba(255,255,255,.03) inset;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 28px rgba(0,0,0,.32);
  --shadow-md: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 48px rgba(0,0,0,.42);
  --shadow-lg: 0 1px 0 rgba(255,255,255,.05) inset, 0 32px 80px rgba(0,0,0,.55);
  --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 0 0 1px rgba(255,255,255,.04);

  --radius: 16px;
  --radius-sm: 8px;
  --radius-xs: 5px;

  --font-display: 'DM Serif Display', Georgia, serif;
  --font-sans: 'DM Sans', 'Helvetica Neue', system-ui, sans-serif;
  --font-mono: 'DM Sans', monospace;

  --sidebar-w: 256px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--paper);
  color:var(--txt);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-weight:400;
  letter-spacing:-.01em;
}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color-scheme:dark;}
option{background:var(--card);color:var(--txt);}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--muted2)}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-sans);font-weight:500}

/* ── Layout Shell ── */
.shell{display:flex;min-height:100vh}

/* ── Sidebar — obsidiana profunda ── */
.sidebar{
  background:var(--obsidian);
  color:#6A7A8A;
  padding:0 12px 20px;
  position:fixed;top:0;left:0;
  width:var(--sidebar-w);height:100vh;
  display:flex;flex-direction:column;gap:1px;
  overflow-y:auto;
  overflow-x:hidden;
  flex-shrink:0;
  z-index:40;
}

/* Offset main content so it doesn't go under fixed sidebar */
.main-wrapper{
  margin-left:var(--sidebar-w);
  flex:1;
  min-width:0;
}
@media(max-width:980px){.main-wrapper{margin-left:0}}
.sidebar::before{
  content:'';
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(184,136,42,.07) 0%, transparent 70%),
    radial-gradient(ellipse 60% 30% at 50% 100%, rgba(184,136,42,.04) 0%, transparent 60%);
  pointer-events:none;
}
.sidebar::after{
  content:'';position:absolute;top:0;right:0;width:1px;height:100%;
  background:linear-gradient(180deg,
    transparent 0%,
    rgba(184,136,42,.25) 30%,
    rgba(184,136,42,.12) 70%,
    transparent 100%
  );
  pointer-events:none;
}

.brandrow{
  padding:28px 12px 20px;
  border-bottom:1px solid rgba(255,255,255,.04);
  margin-bottom:10px;
  position:relative;
}
.brand-logo-wrap{display:flex;align-items:center;gap:12px}
.brand-emblem{
  width:40px;height:40px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,rgba(184,136,42,.2) 0%,rgba(184,136,42,.06) 100%);
  border:1px solid rgba(184,136,42,.35);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:17px;font-weight:400;
  color:var(--gold2);letter-spacing:.02em;
  position:relative;
}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{
  font-family:var(--font-display);font-weight:400;font-size:17px;
  color:#F0EBE0;letter-spacing:.01em;line-height:1.2;
}
.brand-tagline{
  font-size:9px;font-weight:500;color:rgba(184,136,42,.5);
  letter-spacing:.18em;text-transform:uppercase;
}

.nav-section-label{
  font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.15);padding:16px 12px 4px;
}

.navbtn{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:9px;color:rgba(255,255,255,.32);font-weight:400;font-size:13px;
  width:100%;text-align:left;transition:all .16s ease;position:relative;
  letter-spacing:.01em;
}
.navbtn:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.65)}
.navbtn.active{
  background:rgba(184,136,42,.12);
  color:#F0EBE0;
}
.navbtn.active::before{
  content:'';position:absolute;left:0;top:18%;bottom:18%;width:2px;
  background:linear-gradient(180deg,var(--gold2),var(--gold-dim));
  border-radius:0 2px 2px 0;
}
.navbtn svg{width:15px;height:15px;flex:none;stroke-width:1.5;opacity:.5;transition:opacity .16s}
.navbtn.active svg{opacity:1;color:var(--gold2)}
.navbtn:hover svg{opacity:.75}

.sidebar-footer{
  margin-top:auto;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.05);
}

/* Sync indicator */
.sync-indicator{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px 3px;font-size:11px;color:rgba(255,255,255,.25);
}
.sync-dot{
  width:6px;height:6px;border-radius:50%;
  background:#4A8C6A;
  box-shadow:0 0 6px rgba(74,140,106,.5);
  transition:background .3s;
}
.sync-dot.syncing{background:#B8882A;animation:pulse .8s infinite}
.sync-dot.error{background:#8B3A3A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sidebar-footer-brand{
  font-size:9.5px;color:rgba(255,255,255,.12);padding:8px 12px 4px;
  letter-spacing:.06em;
}

/* ── Main ── */
.main{
  padding:40px 44px 100px;
  max-width:1280px;margin:0 auto;width:100%;
}
@media(max-width:1100px){.main{padding:32px 28px 100px}}
@media(max-width:560px){.main{padding:20px 16px 100px}}

/* ── Top bar ── */
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:32px;
}
.eyebrow{
  font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-dim);margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.eyebrow::before{
  content:'';width:16px;height:1px;
  background:linear-gradient(90deg,var(--gold),transparent);
  display:inline-block;
}
.h-title{
  font-family:var(--font-display);font-size:30px;font-weight:400;
  color:var(--ink);line-height:1.1;letter-spacing:-.02em;
}
@media(max-width:560px){.h-title{font-size:24px}}

.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selwrap{
  display:flex;align-items:center;gap:7px;
  background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 14px;
  box-shadow:var(--shadow-xs);transition:.18s;
}
.selwrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,136,42,.1)}
.selwrap label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2)}
.selwrap select{border:none;outline:none;font-weight:500;color:var(--ink);background:none;font-size:13px}

/* ── KPI cards ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:960px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.kpis{grid-template-columns:1fr}}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
}

.kpi{
  padding:22px 22px 18px;position:relative;overflow:hidden;
  transition:all .22s cubic-bezier(.25,.46,.45,.94);
}
.kpi-accent{
  position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent 0%,var(--gold) 50%,transparent 100%);
  opacity:.4;
}
.kpi .lab{
  font-size:10px;font-weight:500;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin-top:2px;
}
.kpi .val{
  font-family:var(--font-display);font-size:23px;font-weight:400;
  margin-top:10px;line-height:1;letter-spacing:-.01em;
}
.kpi .cap{font-size:11px;color:var(--muted);margin-top:8px;font-weight:400;line-height:1.3}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{
  border-color:rgba(184,136,42,.35);
  box-shadow:0 8px 28px rgba(12,15,20,.10),0 0 0 1px rgba(184,136,42,.18);
  transform:translateY(-2px);
}
.kpi .cap.cta{color:var(--gold-dim);font-weight:500}

/* ── Section header & panels ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

.sec-h{
  font-size:9.5px;font-weight:600;color:var(--muted);
  background:var(--tint);
  padding:13px 20px 10px;
  letter-spacing:.11em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line);
}
.panel{margin-bottom:16px;overflow:hidden}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 18px}
thead th{
  background:var(--tint);color:var(--muted);font-weight:600;
  font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;
  border-bottom:1px solid var(--line);
}
tbody tr{border-bottom:1px solid var(--line);transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child{border-bottom:none}
td.r,th.r{text-align:right}
.bar{height:3px;border-radius:99px;background:var(--tint);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.25,.46,.45,.94)}

/* ── Tags / Chips / Pills ── */
.tag{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.04em}
.tag.rec{background:var(--pos-lt);color:var(--pos)}
.tag.des{background:var(--neg-lt);color:var(--neg)}
.tag.inv{background:var(--sage-lt);color:var(--sage)}

.chip{
  padding:7px 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:400;color:var(--muted);
  transition:all .15s;box-shadow:var(--shadow-xs);
}
.chip:hover{border-color:var(--gold);color:var(--gold-dim)}
.chip.on{
  background:var(--obsidian);color:#F0EBE0;border-color:var(--ink);
  box-shadow:0 3px 12px rgba(12,15,20,.22);
}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 18px;border-radius:9px;
  font-size:13px;font-weight:500;
  transition:all .16s;cursor:pointer;
  font-family:var(--font-sans);
}
.btn-primary{
  background:var(--obsidian);color:#F0EBE0;
  box-shadow:0 2px 8px rgba(12,15,20,.18);
}
.btn-primary:hover{background:var(--obsidian2);box-shadow:0 4px 14px rgba(12,15,20,.24)}
.btn-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--line);
}
.btn-ghost:hover{background:var(--tint);color:var(--txt);border-color:var(--muted2)}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Forms ── */
.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);
}
.field input,.field select,.field textarea{
  padding:10px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  color:var(--txt);
  font-size:14px;
  transition:.16s;
  outline:none;
  width:100%;
  font-family:var(--font-sans);
}
.field input:focus,.field select:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(184,136,42,.1);
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}

/* ── Modal ── */
.modal-bg{
  position:fixed;inset:0;z-index:100;
  background:rgba(12,15,20,.55);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:18px;
  width:100%;max-width:560px;
  box-shadow:0 32px 80px rgba(12,15,20,.28),0 0 0 1px rgba(12,15,20,.06);
  overflow:hidden;
  animation:slideUp .22s cubic-bezier(.25,.46,.45,.94);
}
@keyframes slideUp{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 16px;
  border-bottom:1px solid var(--line);
  background:var(--tint);
}
.modal-h h3{font-family:var(--font-display);font-size:20px;font-weight:400;color:var(--ink)}
.modal-b{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}

/* ── Toast ── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:var(--obsidian);color:#F0EBE0;
  padding:11px 22px;border-radius:99px;
  font-size:13px;font-weight:500;
  box-shadow:0 8px 24px rgba(12,15,20,.28);
  z-index:200;
  animation:toastIn .22s cubic-bezier(.25,.46,.45,.94);
  white-space:nowrap;
  border:1px solid rgba(184,136,42,.2);
}
@keyframes toastIn{from{transform:translateX(-50%) translateY(12px);opacity:0}to{transform:translateX(-50%);opacity:1}}

/* ── Loading screen ── */
.loading-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--paper);
}
.loading-brand{
  font-family:var(--font-display);font-size:22px;color:var(--ink);
  font-weight:400;letter-spacing:.01em;
}
.loading-sub{
  font-size:12px;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;font-weight:400;
}
.spinner{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--gold);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Back button ── */
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);cursor:pointer;
  margin-bottom:20px;padding:7px 12px;
  border-radius:8px;border:1px solid var(--line);
  background:var(--card);transition:.15s;
  font-weight:500;
}
.back-btn:hover{color:var(--txt);border-color:var(--muted2)}

/* ── Category detail header ── */
.cat-detail-header{
  background:var(--obsidian);
  border-radius:var(--radius);
  padding:28px 32px;
  margin-bottom:24px;
  position:relative;overflow:hidden;
}
.cat-detail-header::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(184,136,42,.1) 0%,transparent 70%);
}

/* ── Bar chart ── */
.barchart{
  display:grid;grid-template-columns:repeat(12,1fr);gap:6px;
  align-items:end;min-height:160px;position:relative;
  padding-top:20px;
}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.bars{display:flex;gap:2px;align-items:end;height:140px}
.bars span{
  width:7px;border-radius:3px 3px 0 0;
  min-height:2px;transition:height .5s cubic-bezier(.25,.46,.45,.94);
}
.mlab{font-size:9.5px;color:var(--muted);text-align:center;font-weight:500}

/* ── Note ── */
.note{font-size:12px;color:var(--muted);margin:0 4px 20px;line-height:1.6}

/* ── Empty state ── */
.empty{
  text-align:center;padding:40px;
  color:var(--muted);font-size:13px;
  font-style:italic;
}

/* ── Mobile nav ── */
.mobtab{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(14,17,23,.94);
  backdrop-filter:blur(16px) saturate(180%);
  border-top:1px solid var(--line);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:50;
  justify-content:space-around;
  box-shadow:0 -4px 20px rgba(0,0,0,.4);
}
@media(max-width:980px){.mobtab{display:flex}}
.mobtab button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 6px;border-radius:9px;
  font-size:9px;color:var(--muted);font-weight:500;
  flex:1;max-width:64px;transition:.15s;
  letter-spacing:.02em;
}
.mobtab button svg{width:20px;height:20px;stroke-width:1.4;transition:.15s}
.mobtab button.active{color:var(--ink)}
.mobtab button.active svg{color:var(--gold2)}
.mobtab button:hover{background:var(--tint)}

/* ── Responsivo: mobile e tablets ── */
@media(max-width:980px){
  .sidebar{display:none!important;}
  .main-wrapper{margin-left:0!important;}
}
@media(max-width:960px){
  /* Painel de saúde vira coluna */
  .health-premium{flex-direction:column!important;}
  .health-left{width:100%!important;border-right:none!important;border-bottom:1px solid var(--line);padding-bottom:18px;}
  /* Hero card */
  .premium-hero-content{flex-direction:column;gap:20px;padding:24px 20px 18px!important;}
  .premium-hero-right{border-left:none!important;padding-left:0!important;align-items:flex-start!important;width:100%;}
  .patrimonio-display{text-align:left!important;}
  .patrimonio-delta{justify-content:flex-start!important;}
  .premium-hero-title{font-size:26px!important;}
  .patrimonio-value{font-size:34px!important;}
  /* Ticker: 5 colunas viram grid 3+2 */
  .ticker-strip{flex-wrap:wrap!important;}
  .ticker-item{flex:1 0 33%!important;padding:8px 10px!important;font-size:10.5px!important;}
  /* Insights do gráfico: 4 colunas viram 2x2 */
  .chart-insights{grid-template-columns:1fr 1fr!important;}
  .chart-insight:nth-child(1),.chart-insight:nth-child(3){border-right:1px solid var(--line);}
  .chart-insight:nth-child(1),.chart-insight:nth-child(2){border-bottom:1px solid var(--line);}
  .chart-insight:nth-child(2){border-right:none;}
  /* KPI: 4→2 cols (já existe), garantir padding menor */
  .kpi{padding:14px 16px!important;}
  /* Cards lado-a-lado viram empilhados */
  .grid2{grid-template-columns:1fr!important;}
  /* Tabelas com scroll horizontal */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{min-width:560px;}
  /* Modal full-screen no mobile */
  .modal{max-height:92vh;border-radius:16px 16px 0 0!important;align-self:flex-end;}
  .modal-bg{padding:0!important;align-items:flex-end!important;}
  /* Bars: barras menores */
  .bars-3d-wrap{height:170px;}
  .bar-3d-col{min-height:160px;}
  .bar-3d-group{transform:scale(.85);}
  .bar-3d-mlab{font-size:9px;}
  .bar-3d-saldo{font-size:8px;}
}
@media(max-width:560px){
  /* Mobile compacto */
  .main{padding:16px 14px 100px!important;}
  .premium-hero-stats{gap:14px!important;flex-wrap:wrap;}
  .premium-stat{padding:0!important;flex:1 0 calc(50% - 7px);}
  .premium-stat::before{display:none!important;}
  .ticker-item{flex:1 0 50%!important;font-size:10px!important;}
  /* Painel de saúde mais compacto */
  .health-score-ring svg{width:96px!important;height:96px!important;}
  /* Header eyebrow menor */
  .h-eyebrow{font-size:9.5px!important;}
  /* Botões em barra ficam empilhados */
  .controls{gap:6px;}
  .btn{font-size:12px;padding:8px 12px;}
  /* Donut chart fica menor */
  .donut-wrap{flex-direction:column!important;align-items:center;}
  .donut-legend{margin-top:14px;width:100%;}
}

/* ── Auth Screen ── */
.auth-bg{

/* 3D KPI Cards */
.kpi-3d{
  padding:22px 22px 18px;position:relative;overflow:hidden;

}
.kpi-3d::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 60%);

  transition:opacity .28s;
}
.kpi-3d:hover{
  transform:translateY(-4px) rotateX(2deg);
  box-shadow:0 14px 36px rgba(12,15,20,.14),0 0 0 1px rgba(184,136,42,.22);
}

.kpi-3d .kpi-shimmer{
  position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse 40% 40% at 50% 50%,rgba(184,136,42,.06),transparent 70%);
  animation:shimmerRot 8s linear infinite;
  pointer-events:none;

@keyframes shimmerRot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* 3D Chart */
.chart-3d-container{
  padding:16px 20px 20px;
}

.bar-3d-col{

  display:flex;gap:2px;align-items:end;

}
.bar-3d{
  border-radius:4px 4px 0 0;

  transition:height .6s cubic-bezier(.25,.46,.45,.94),opacity .3s;

  transform-origin:bottom center;

.bar-3d::after{
  content:'';

@keyframes countUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim-num{animation:countUp .5s cubic-bezier(.25,.46,.45,.94) both;}

/* Pulse dot for live feel */
.live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--pos);

.period-pill:hover{border-color:var(--gold);color:var(--gold-dim);}

/* DRE Lines */

/* ============================================================
   HISTÓRICO DE PATRIMÔNIO — reconstituído a partir dos lançamentos
   ============================================================ */
function patrimonioNaData(data, dataISO){
  // Saldo de cada conta no fim de dataISO (saldoInicial + movimentações até aquela data)
  let saldoTotal = 0;
  (data.contas||[]).forEach(c=>{
    if(!c) return;
    const ini = Number(c.saldoInicial!==undefined?c.saldoInicial:(c.saldo||0))||0;
    const mov = (data.lancamentos||[]).filter(l=>l && l.conta===c.nome && l.data<=dataISO).reduce((s,l)=>{
      const v = Number(l.valor)||0;
      if(l.tipo==='Receita') return s+v;
      if(l.tipo==='Despesa') return s-v;
      if(l.tipo==='Investimento') return s+(/resgate|venda/i.test(l.categoria||'')?v:-v);
      return s;
    },0);
    saldoTotal += ini + mov;
  });
  // Carteira de investimentos: usa o aplicado total (valor histórico investido)
  // como aproximação do valor da carteira em meses passados — já que cotações
  // históricas não são armazenadas. Investimentos lançados no app movimentaram
  // o saldo das contas, então não somamos invLiquido aqui para não contar duplo.
  const aplicadoTotal = sum(data.investimentos||[], x=>Number(x.aplicado)||0);
  return saldoTotal + aplicadoTotal;
}
function historicoPatrimonio(data, meses){
  meses = meses || 12;
  const hoje = new Date();
  const arr = [];
  for(let i=meses-1; i>=0; i--){
    const d = new Date(hoje.getFullYear(), hoje.getMonth()-i+1, 0);
    const z = n => String(n).padStart(2,'0');
    const iso = d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
    let pat = patrimonioNaData(data, iso);
    // No mês corrente, soma o ganho/perda da carteira (atual - aplicado)
    if(i===0){
      const aplicado = sum(data.investimentos||[], x=>Number(x.aplicado)||0);
      const atual = sum(data.investimentos||[], x=>Number(x.atual)||0);
      pat += (atual - aplicado);
    }
    arr.push({
      data: iso,
      mes: MESES[d.getMonth()],
      ano: d.getFullYear(),
      patrimonio: pat
    });
  }
  return arr;
}

// Retorna array de N pontos com o valor agregado de cada mês
// tipo: 'receita' | 'despesa' | 'saldo' | 'poupanca' | 'patrimonio'
function serieMensal(data, tipo, meses){
  meses = meses || 12;
  const hoje = new Date();
  const arr = [];
  for(let i=meses-1; i>=0; i--){
    const ini = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
    const fim = new Date(hoje.getFullYear(), hoje.getMonth()-i+1, 0);
    const z = n => String(n).padStart(2,'0');
    const isoIni = ini.getFullYear()+'-'+z(ini.getMonth()+1)+'-01';
    const isoFim = fim.getFullYear()+'-'+z(fim.getMonth()+1)+'-'+z(fim.getDate());
    const lcs = (data.lancamentos||[]).filter(l=>l && l.data>=isoIni && l.data<=isoFim && !l.transfer);
    const rec = lcs.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+(Number(l.valor)||0),0);
    const des = lcs.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+(Number(l.valor)||0),0);
    let val=0;
    if(tipo==='receita') val=rec;
    else if(tipo==='despesa') val=des;
    else if(tipo==='saldo') val=rec-des;
    else if(tipo==='poupanca') val= rec>0 ? (rec-des)/rec : 0;
    arr.push(val);
  }
  return arr;
}

// Sparkline SVG genérica — uma mini linha com gradiente preenchendo embaixo
function Sparkline({values, color, fillColor, width, height}){
  width = width || 90;
  height = height || 28;
  if(!values || values.length < 2) return null;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = (max - min) || 1;
  // padding interno para o último ponto não cortar
  const padX = 2, padY = 3;
  const w = width - padX*2;
  const h = height - padY*2;
  const pts = values.map((v,i)=>{
    const x = padX + (i/(values.length-1))*w;
    // se max===min, centraliza no meio
    const y = padY + h - (range===1 && max===min ? h/2 : ((v - min)/range)*h);
    return {x,y};
  });
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(2)+','+p.y.toFixed(2)).join(' ');
  const areaPath = linePath + ' L'+pts[pts.length-1].x.toFixed(2)+','+(padY+h)+' L'+pts[0].x.toFixed(2)+','+(padY+h)+' Z';
  const gradId = 'spark-'+Math.random().toString(36).slice(2,9);
  const c = color || '#C9962A';
  const fc = fillColor || c;
  const lastPt = pts[pts.length-1];

  return React.createElement('svg', {
    viewBox: `0 0 ${width} ${height}`,
    style: {width: width+'px', height: height+'px', display: 'block', overflow: 'visible'}
  },
    React.createElement('defs', null,
      React.createElement('linearGradient', {id: gradId, x1:0, y1:0, x2:0, y2:1},
        React.createElement('stop', {offset:'0%', stopColor:fc, stopOpacity:0.32}),
        React.createElement('stop', {offset:'100%', stopColor:fc, stopOpacity:0})
      )
    ),
    React.createElement('path', {d: areaPath, fill: 'url(#'+gradId+')'}),
    React.createElement('path', {d: linePath, fill:'none', stroke:c, strokeWidth:1.6, strokeLinecap:'round', strokeLinejoin:'round'}),
    React.createElement('circle', {cx: lastPt.x, cy: lastPt.y, r: 2.4, fill: c, stroke:'var(--card)', strokeWidth: 1.2})
  );
}

// Cores em RGB para o PDF (jsPDF não lê CSS vars)
const PDF_COR = {
  obsidian:[14,17,23], gold:[201,150,42], gold2:[224,182,85], pos:[109,176,154], neg:[196,112,112],
  ink:[232,228,216], muted:[138,142,150], line:[210,205,195]

// PDF: Relatório completo de análise + investimentos
function exportarPDF(data, ano, ctx){
  const libs = libsExportDisponiveis();
  if(!libs.pdf){ alert('Biblioteca PDF não carregada. Verifique sua conexão e recarregue a página.'); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W = doc.internal.pageSize.getWidth();
  let y = 16;

  // Cabeçalho premium
  doc.setFillColor(...PDF_COR.obsidian); doc.rect(0,0,W,32,'F');
  doc.setTextColor(...PDF_COR.gold2); doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text('VAULTIS',14,16);
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...PDF_COR.ink);
  doc.text('Relatório financeiro · '+ano,14,23);
  const hoje = new Date().toLocaleDateString('pt-BR');
  doc.setFontSize(8); doc.setTextColor(...PDF_COR.muted);
  doc.text('Gerado em '+hoje, W-14, 23, {align:'right'});
  y = 44;

  // Resumo do ano
  const lancAno = data.lancamentos.filter(l=>+l.data.slice(0,4)===ano && !l.transfer);
  const receitas = sum(lancAno.filter(l=>l.tipo==='Receita'),l=>l.valor);
  const despesas = sum(lancAno.filter(l=>l.tipo==='Despesa'),l=>l.valor);
  const saldo = receitas-despesas;
  const taxa = receitas>0 ? saldo/receitas : 0;

  doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(...PDF_COR.obsidian);
  doc.text('Visão Geral do Período',14,y); y+=8;
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  const stats = [
    ['Receitas',fmtBRL(receitas)], ['Despesas',fmtBRL(despesas)],
    ['Saldo do período',fmtBRL(saldo)], ['Taxa de poupança',(taxa*100).toFixed(1)+'%']
  ];
  doc.autoTable({
    startY:y, head:[['Indicador','Valor']], body:stats,
    theme:'plain',
    headStyles:{fillColor:PDF_COR.obsidian,textColor:PDF_COR.gold2,fontSize:9,fontStyle:'bold'},
    styles:{fontSize:10,cellPadding:4},
    columnStyles:{1:{halign:'right',fontStyle:'bold'}},
    margin:{left:14,right:14}
  });
  y = doc.lastAutoTable.finalY + 10;

  // Despesas por categoria
  const porCat = {};
  lancAno.filter(l=>l.tipo==='Despesa').forEach(l=>porCat[l.categoria]=(porCat[l.categoria]||0)+l.valor);
  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length){
    doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.text('Despesas por Categoria',14,y); y+=2;
    const totDes = cats.reduce((s,[,v])=>s+v,0)||1;
    doc.autoTable({
      startY:y+4,
      head:[['Categoria','Valor','% do total']],
      body:cats.map(([c,v])=>[c,fmtBRL(v),(v/totDes*100).toFixed(1)+'%']),
      theme:'striped',
      headStyles:{fillColor:PDF_COR.obsidian,textColor:PDF_COR.gold2,fontSize:9},
      styles:{fontSize:9,cellPadding:3},
      columnStyles:{1:{halign:'right'},2:{halign:'right',cellWidth:30}},
      margin:{left:14,right:14}
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  // Investimentos
  if((data.investimentos||[]).length){
    if(y > 230){ doc.addPage(); y=20; }
    doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.text('Carteira de Investimentos',14,y);
    const invs = data.investimentos.map(i=>{
      const r = i.aplicado>0 ? (i.atual-i.aplicado)/i.aplicado : 0;
      return [i.ativo||i.ticker||'—', i.classe||'—', fmtBRL(i.aplicado||0), fmtBRL(i.atual||0), (r*100).toFixed(2)+'%'];
    });
    const totalAplic = sum(data.investimentos,i=>i.aplicado||0);
    const totalAtual = sum(data.investimentos,i=>i.atual||0);
    const rentTotal = totalAplic>0 ? (totalAtual-totalAplic)/totalAplic : 0;
    doc.autoTable({
      startY:y+4,
      head:[['Ativo','Classe','Aplicado','Atual','Rent.']],
      body:invs,
      foot:[['Total','',fmtBRL(totalAplic),fmtBRL(totalAtual),(rentTotal*100).toFixed(2)+'%']],
      theme:'striped',
      headStyles:{fillColor:PDF_COR.obsidian,textColor:PDF_COR.gold2,fontSize:9},
      footStyles:{fillColor:[230,228,220],textColor:PDF_COR.obsidian,fontStyle:'bold'},
      styles:{fontSize:9,cellPadding:3},
      columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}},
      margin:{left:14,right:14}
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  // Saúde financeira
  if(ctx && ctx.saude){
    if(y > 240){ doc.addPage(); y=20; }
    doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.text('Diagnóstico de Saúde Financeira',14,y); y+=8;
    doc.setFontSize(22); doc.setTextColor(...PDF_COR.gold);
    doc.text(String(ctx.saude.nota)+' pts',14,y); doc.setFontSize(11); doc.setTextColor(...PDF_COR.obsidian);
    doc.text('('+ctx.saude.status+')',45,y);
    y+=8;
    doc.setFontSize(10); doc.setFont('helvetica','normal');
    const linhas = doc.splitTextToSize(ctx.saude.resumo, W-28);
    doc.text(linhas,14,y); y+= linhas.length*5 + 4;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('Sinais identificados:',14,y); y+=6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    (ctx.saude.sinais||[]).slice(0,8).forEach(s=>{
      const marker = s.ok===true?'[+]':(s.ok===false?'[!]':'[ ]');
      doc.setTextColor(...(s.ok===true?PDF_COR.pos:(s.ok===false?PDF_COR.neg:PDF_COR.muted)));
      doc.text(marker, 14, y);
      doc.setTextColor(...PDF_COR.obsidian);
      const t = doc.splitTextToSize(s.txt, W-32);
      doc.text(t, 22, y); y += t.length*5 + 1;
      if(y>275){ doc.addPage(); y=20; }
    });
  }

  doc.save(nomeArquivo('Vaultis_Relatorio')+'pdf');
}

// Excel: Movimentação completa
function exportarExcel(data, ano){
  const libs = libsExportDisponiveis();
  if(!libs.xlsx){ alert('Biblioteca Excel não carregada. Verifique sua conexão e recarregue a página.'); return; }
  const XLSX = window.XLSX;
  const wb = XLSX.utils.book_new();

  // Aba 1: Lançamentos
  const lancAno = data.lancamentos.filter(l=>+l.data.slice(0,4)===ano).sort((a,b)=>a.data.localeCompare(b.data));
  const ws1Data = [
    ['Data','Tipo','Grupo','Categoria','Descrição','Forma','Conta','Valor (R$)','Cartão','Parcela'],
    ...lancAno.map(l=>{
      const cartaoNome = l.cartaoId && (data.cartoes||[]).find(c=>c.id===l.cartaoId)?.nome || '';
      const parcela = l.parcelas>1 ? `${l.parcelaAtual}/${l.parcelas}` : '';
      return [l.data, l.tipo, l.grupo||'', l.categoria||'', l.descricao||'', l.forma||'', l.conta||'', l.valor||0, cartaoNome, parcela];
    })
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(ws1Data);
  ws1['!cols'] = [{wch:12},{wch:14},{wch:18},{wch:22},{wch:30},{wch:18},{wch:18},{wch:14},{wch:18},{wch:10}];
  // formato monetário coluna H (índice 7)
  for(let r=2;r<=ws1Data.length;r++){ const ref=XLSX.utils.encode_cell({r:r-1,c:7}); if(ws1[ref]) ws1[ref].z='"R$ "#,##0.00'; }
  XLSX.utils.book_append_sheet(wb, ws1, 'Lançamentos');

  // Aba 2: Resumo por mês
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const linhasMes = meses.map((nome,i)=>{
    const ls = lancAno.filter(l=>+l.data.slice(5,7)===i+1 && !l.transfer);
    const r = sum(ls.filter(l=>l.tipo==='Receita'),l=>l.valor);

  });

        return s;
      },0);
      const saldoAtual = ini+mov;
      const limite = Number(c.limite)||0;
      return [c.nome, c.banco, c.tipo, ini, saldoAtual, limite, saldoAtual+limite];

    XLSX.utils.book_append_sheet(wb, ws3, 'Contas');

  if((data.investimentos||[]).length){
    const linhasI = data.investimentos.map(i=>{

// Próxima data (YYYY-MM-DD) em que cai um certo dia do mês, a partir de hoje
function proximoDia(diaMes, base){
  const hoje = base ? new Date(base) : new Date();
  const ano = hoje.getFullYear(), mes = hoje.getMonth();
  let d = new Date(ano, mes, diaMes);
  if(d < hoje.setHours(0,0,0,0)) d = new Date(ano, mes+1, diaMes);
  return d;
}
function diasAte(date){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dd = new Date(date); dd.setHours(0,0,0,0);
  return Math.round((dd-hoje)/86400000);
}
function fmtData(d){
  const x = (d instanceof Date)?d:new Date(d);
  return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0');
}

/* ============================================================
   VINCULAÇÃO INVESTIMENTO ↔ CARTEIRA
   Aplica um lançamento do tipo Investimento na carteira:
   - encontra o ativo por ticker (ou nome) ou cria um novo
   - soma cotas e valor aplicado e recalcula o preço médio
   - resgate/venda reduz cotas e valor aplicado proporcionalmente
   Retorna a nova lista de investimentos.
   ============================================================ */
function normTicker(t){return String(t||'').trim().toUpperCase();}
function aplicarNaCarteira(investimentos, lanc){
  const lista = investimentos.map(i=>({...i}));
  const tk = normTicker(lanc.ticker);
  const nome = String(lanc.ativo||lanc.descricao||'').trim();
  const cotasMov = parseFloat(lanc.cotas)||0;
  const valor = parseFloat(lanc.valor)||0;
  const isResgate = /resgate|venda/i.test(lanc.categoria||'');
  // localizar ativo: por ticker (se houver) senão por nome
  let idx = -1;
  if(tk) idx = lista.findIndex(i=>normTicker(i.ticker)===tk);
  if(idx<0 && nome) idx = lista.findIndex(i=>String(i.ativo||'').trim().toLowerCase()===nome.toLowerCase());
  if(isResgate){
    if(idx>=0){
      const a=lista[idx];
      const cotasAntes=parseFloat(a.cotas)||0;
      const pm = cotasAntes>0 ? (parseFloat(a.aplicado)||0)/cotasAntes : 0;
      const cotasVend = cotasMov>0?Math.min(cotasMov,cotasAntes):cotasAntes;
      const novasCotas = Math.max(cotasAntes-cotasVend,0);
      a.cotas = novasCotas;
      a.aplicado = Math.max((parseFloat(a.aplicado)||0) - (cotasVend*pm), 0);
      // valor atual proporcional
      const atualUnit = cotasAntes>0 ? (parseFloat(a.atual)||0)/cotasAntes : 0;
      a.atual = novasCotas>0 ? atualUnit*novasCotas : 0;
      a.precoMedio = novasCotas>0 ? a.aplicado/novasCotas : 0;
      if(novasCotas<=0 && (a.aplicado||0)<=0){ lista.splice(idx,1); }
    }
    return lista;
  }
  // compra / aporte
  if(idx>=0){
    const a=lista[idx];
    const cotasAntes=parseFloat(a.cotas)||0;
    const aplicAntes=parseFloat(a.aplicado)||0;
    const novasCotas = cotasAntes + (cotasMov>0?cotasMov:0);
    a.aplicado = aplicAntes + valor;
    a.cotas = novasCotas>0?novasCotas:cotasAntes;
    a.atual = (parseFloat(a.atual)||0) + valor; // sem cotação, soma o aporte ao valor atual
    a.precoMedio = a.cotas>0 ? a.aplicado/a.cotas : 0;
    if(lanc.classe) a.classe=a.classe||lanc.classe;
    if(tk && !a.ticker) a.ticker=tk;
    a.ultimoAporte = lanc.data;
    return lista;
  }
  // novo ativo
  const cotas = cotasMov>0?cotasMov:1;
  lista.push({
    id:uid(), ativo: nome||tk||'Novo ativo', ticker: tk,
    classe: lanc.classe||'Renda Fixa', aporte: lanc.data, ultimoAporte: lanc.data,
    cotas, aplicado: valor, atual: valor, precoMedio: cotas>0?valor/cotas:valor,
    origemLancamento:true
  });
  return lista;
}

/* ============================================================
   SUPABASE DB LAYER — multi-usuário com auth
   Tabela: financa_data (id uuid pk, user_id uuid, payload jsonb, updated_at timestamptz)
   RLS garante que cada usuário acessa apenas seus dados.
   ============================================================ */

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo esgotado ('+(label||'rede')+')')), ms))
  ]);
}
async function dbLoad(userId) {
  const {data,error} = await withTimeout(
    sb.from('financa_data').select('payload').eq('user_id',userId).maybeSingle(),
    8000, 'carregar dados'
  );
  if(error) throw error;
  return data ? data.payload : null;
}

async function dbSave(userId, payload) {
  const {error} = await sb.from('financa_data').upsert(
    {user_id: userId, payload, updated_at: new Date().toISOString()},
    {onConflict:'user_id'}
  );
  if(error) throw error;
}

function AuthScreen({onAuth}) {

  const [senha, setSenha] = useState('');

  const [msg, setMsg] = useState('');
  const [carregando, setCarregando] = useState(false);

  async function entrar(e) {
    e.preventDefault();
    setErro(''); setMsg('');
    if(!email||!senha){setErro('Preencha e-mail e senha.');return;}
    setCarregando(true);
    try {
      const {data,error} = await sb.auth.signInWithPassword({email,password:senha});
      if(error) throw error;
      onAuth(data.user);
    } catch(err) {
      setErro(traduzirErro(err.message));
    } finally { setCarregando(false); }
  }

  async function cadastrar(e) {
    e.preventDefault();
    setErro(''); setMsg('');
    if(!email||!senha){setErro('Preencha e-mail e senha.');return;}
    if(senha.length<6){setErro('A senha precisa ter pelo menos 6 caracteres.');return;}
    setCarregando(true);
    try {
      const {data,error} = await sb.auth.signUp({email,password:senha,options:{data:{nome}}});
      if(error) throw error;
      if(data.user && data.user.identities && data.user.identities.length===0) {
        setErro('Este e-mail já está cadastrado. Faça login.');
      } else {
        setMsg('Cadastro realizado! Verifique seu e-mail para confirmar a conta, depois faça login.');
        setModo('login');
      }
    } catch(err) {
      setErro(traduzirErro(err.message));

/* ============================================================
   MODO DE EXECUÇÃO
   — LOCAL  (file:// ou http://localhost): localStorage only, sem login
   — ONLINE (https://...): Supabase Auth + banco na nuvem
   ============================================================ */
const IS_LOCAL = (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
const LOCAL_KEY = 'vaultis_local_data';

function migrarDados(d) {
  if(!d) return d;
  if(!d.gruposCat) {
    d = {...d, gruposCat:{
      gruposRec:[...DEFAULT_GRUPOS_REC],
      catsRec:JSON.parse(JSON.stringify(DEFAULT_CATS_REC)),
      gruposDes:[...DEFAULT_GRUPOS_DES],
      catsDes:JSON.parse(JSON.stringify(DEFAULT_CATS_DES)),
    }};
  }
  if(d.investimentos && d.investimentos.some(i=>i.cotas===undefined)){
    d = {...d, investimentos: d.investimentos.map(i=>({
      ticker: i.ticker||'', cotas: i.cotas!==undefined?i.cotas:1, ...i,
    }))};
  }
  if(d.investimentos){
    d = {...d, investimentos: d.investimentos.map(i=>({
      ...i, precoMedio: (i.precoMedio!==undefined?i.precoMedio:((i.cotas>0)?(i.aplicado/i.cotas):0))
    }))};
  }
  if(d.gruposCat){
    const gc={...d.gruposCat};
    if(gc.gruposDes && gc.gruposDes.includes('Investimentos')) gc.gruposDes=gc.gruposDes.filter(g=>g!=='Investimentos');
    if(gc.catsDes && gc.catsDes['Investimentos']){ const cd={...gc.catsDes}; delete cd['Investimentos']; gc.catsDes=cd; }
    d={...d,gruposCat:gc};
  }
  if(!d.contas) d = {...d, contas:[{id:uid(),nome:"Conta Principal",banco:"Banco principal",tipo:"Corrente",saldoInicial:0,limite:0,cor:"#5E7C76"}]};
  if(d.contas) d = {...d, contas:d.contas.map(c=> c.saldoInicial!==undefined ? c : {...c, saldoInicial: c.saldo||0})};
  if(d.contas) d = {...d, contas:d.contas.map(c=> c.limite!==undefined ? c : {...c, limite: 0})};
  if(!d.cartoes) d = {...d, cartoes:[]};
  if(!d.alavancagem || !d.alavancagem.retirada || !d.alavancagem.rendaDesejada) {
    d = {...d, alavancagem:{
      aporteMensal: d.alavancagem?.aporteMensal || 2000,
      real:         d.alavancagem?.real         || 0.08,
      rendaDesejada:d.alavancagem?.rendaDesejada|| 8000,
      retirada:     d.alavancagem?.retirada     || 0.04,
    }};
  }
  return d;
}

/* ============================================================
   APP ROOT — com autenticação (online) ou localStorage (local)
   ============================================================ */
function App() {
  const [user, setUser]       = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [appData, setAppData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [syncState, setSyncState] = useState('ok');
  const saveTimer = useRef(null);

  // ── MODO LOCAL: pula Supabase completamente ──────────────────
  useEffect(()=>{
    if(!IS_LOCAL) return;
    // Carrega do localStorage ou cria seed
    let raw = null;
    try { raw = localStorage.getItem(LOCAL_KEY); } catch(e){}
    let d = raw ? JSON.parse(raw) : null;
    if(!d) { d = seedData(); try { localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); } catch(e){} }
    d = migrarDados(d);
    // Usuário fictício para modo local
    setUser({id:'local', email:'modo-local@vaultis.app', isLocal:true});
    setAppData(d);
    setAuthReady(true);
  },[]);

  // ── MODO ONLINE: Supabase ────────────────────────────────────
  useEffect(()=>{
    if(IS_LOCAL) return;
    let cancelado = false;

    async function iniciar() {
      // Tenta pegar sessão com timeout de 4s
      try {
        const resultado = await Promise.race([
          sb.auth.getSession(),
          new Promise((_,rej) => setTimeout(()=>rej(new Error('timeout')), 4000))
        ]);
        if(cancelado) return;
        const session = resultado?.data?.session;
        setUser(session?.user ?? null);
      } catch(e) {
        console.warn('Supabase getSession falhou:', e.message);
        if(cancelado) return;
        setUser(null);
      }
      if(!cancelado) setAuthReady(true);
    }

    iniciar();

    // Listener separado — não bloqueia o fluxo principal
    let unsub = null;
    try {
      const {data} = sb.auth.onAuthStateChange((_event, session) => {
        if(!cancelado) setUser(session?.user ?? null);
      });
      unsub = data?.subscription;
    } catch(e) { console.warn('onAuthStateChange erro:', e); }

    return () => { cancelado = true; unsub?.unsubscribe(); };
  },[]);

  // Carrega dados do Supabase quando user muda (online only)
  useEffect(()=>{
    if(IS_LOCAL) return;
    if(!user) { setAppData(null); return; }
    setLoading(true);
    (async()=>{
      try {
        let d = await dbLoad(user.id);
        if(!d) { d = seedData(); await dbSave(user.id, d); }
        d = migrarDados(d);
        setAppData(d);
      } catch(e) {
        console.error('Supabase load error:', e);
        const local = localStorage.getItem('financa_fallback_'+user.id);
        setAppData(migrarDados(local ? JSON.parse(local) : seedData()));
        setSyncState('error');
      } finally { setLoading(false); }
    })();
  },[user]);

  // Auto-save
  const updateData = useCallback((updater)=>{
    if(!user) return;
    setAppData(prev=>{
      const next = typeof updater === 'function' ? updater(prev) : updater;
      // Salva local sempre (fallback + modo local)
      const lsKey = IS_LOCAL ? LOCAL_KEY : 'financa_fallback_'+user.id;
      try { localStorage.setItem(lsKey, JSON.stringify(next)); } catch(e){}
      if(!IS_LOCAL) {
        clearTimeout(saveTimer.current);
        setSyncState('syncing');
        saveTimer.current = setTimeout(async()=>{
          try { await dbSave(user.id, next); setSyncState('ok'); }
          catch(e) { console.error('Supabase save error:', e); setSyncState('error'); }
        }, 1500);
      }
      return next;
    });
  },[user]);

  async function sair() {
    if(IS_LOCAL) {
      // No modo local, limpa os dados e recarrega
      try { localStorage.removeItem(LOCAL_KEY); } catch(e){}
      location.reload();
      return;
    }
    await sb.auth.signOut();
    setAppData(null);
    setUser(null);
  }

  // Aguardando inicialização
  if(!authReady) return React.createElement("div",{className:"loading-screen"},
    React.createElement("div",{style:{textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:16,maxWidth:400,padding:'0 20px'}},
      React.createElement("div",{style:{width:52,height:52,borderRadius:13,background:'linear-gradient(135deg,rgba(184,136,42,.15),rgba(184,136,42,.04))',border:'1px solid rgba(184,136,42,.3)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-display)',fontSize:22,fontWeight:400,color:'#B8882A',marginBottom:4}},"V"),
      React.createElement("div",{className:"loading-brand"},"Vaultis"),
      React.createElement("div",{className:"spinner"}),
      React.createElement("div",{className:"loading-sub"},IS_LOCAL?"Carregando dados locais...":"Conectando ao servidor..."),
      React.createElement(FallbackTimer)
    )
  );

  // Online: não logado → tela de login
  if(!IS_LOCAL && !user) return React.createElement(AuthScreen,{onAuth:setUser});

  // Carregando dados
  if(loading||!appData) return React.createElement("div",{className:"loading-screen"},
    React.createElement("div",{style:{textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:16}},
      React.createElement("div",{style:{width:52,height:52,borderRadius:13,background:'linear-gradient(135deg,rgba(184,136,42,.15),rgba(184,136,42,.04))',border:'1px solid rgba(184,136,42,.3)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-display)',fontSize:22,fontWeight:400,color:'#B8882A',marginBottom:4}},"V"),
      React.createElement("div",{className:"loading-brand"},"Vaultis"),
      React.createElement("div",{className:"spinner"}),
      React.createElement("div",{className:"loading-sub"},"Carregando seus dados financeiros...")
    )
  );

  const syncStateLocal = IS_LOCAL ? 'local' : syncState;
  return React.createElement(Dashboard, {data:appData, setData:updateData, syncState:syncStateLocal, user, onSair:sair, isLocal:IS_LOCAL});
}

/* ============================================================
   ANÁLISE DE SAÚDE FINANCEIRA
   Avalia sinais e devolve nota 0-100, status e recomendações.
   ============================================================ */
function analisarSaude({receitas,despesas,saldo,invAtual,contasSaldo,cartoesUso}){
  const sinais = [];
  let pontos = 0, max = 0;

  // 1. Taxa de poupança (peso 30)
  const taxa = receitas>0 ? saldo/receitas : (despesas>0?-1:0);
  max += 30;
  if(receitas<=0 && despesas<=0){
    sinais.push({ok:null,txt:'Sem movimentações no período para avaliar.'});
  } else if(taxa>=0.2){ pontos+=30; sinais.push({ok:true,txt:`Você poupa ${fmtPct(taxa)} da renda — excelente (ideal acima de 20%).`}); }
  else if(taxa>=0.1){ pontos+=22; sinais.push({ok:true,txt:`Poupança de ${fmtPct(taxa)} da renda — bom, tente chegar a 20%.`}); }
  else if(taxa>=0){ pontos+=12; sinais.push({ok:false,txt:`Poupança baixa (${fmtPct(taxa)}). Busque reduzir gastos para guardar mais.`}); }
  else { sinais.push({ok:false,txt:'Você gastou mais do que ganhou no período — alerta de déficit.'}); }

  // 2. Despesa sobre receita (peso 20)
  max += 20;
  if(receitas>0){
    const r = despesas/receitas;
    if(r<=0.7){ pontos+=20; sinais.push({ok:true,txt:`Suas despesas consomem ${fmtPct(r)} da renda — saudável.`}); }
    else if(r<=0.9){ pontos+=12; sinais.push({ok:true,txt:`Despesas em ${fmtPct(r)} da renda — controlado, mas atento.`}); }
    else if(r<=1){ pontos+=6; sinais.push({ok:false,txt:`Despesas em ${fmtPct(r)} da renda — margem apertada.`}); }
    else { sinais.push({ok:false,txt:`Despesas superam a renda (${fmtPct(r)}).`}); }
  }

  // 3. Reserva / patrimônio investido (peso 25) — meses de despesa cobertos
  max += 25;
  const despMensal = despesas>0 ? despesas : 0;
  if(despMensal>0){
    const meses = invAtual/despMensal;
    if(meses>=6){ pontos+=25; sinais.push({ok:true,txt:`Seu patrimônio cobre ${meses.toFixed(1)} meses de despesas — ótima reserva.`}); }
    else if(meses>=3){ pontos+=16; sinais.push({ok:true,txt:`Reserva equivale a ${meses.toFixed(1)} meses — caminhe para 6 meses.`}); }
    else if(meses>=1){ pontos+=8; sinais.push({ok:false,txt:`Reserva cobre só ${meses.toFixed(1)} mês(es). Priorize a reserva de emergência.`}); }
    else { sinais.push({ok:false,txt:'Reserva de emergência insuficiente — comece a construir uma.'}); }
  } else if(invAtual>0){ pontos+=15; sinais.push({ok:true,txt:'Você tem patrimônio investido — bom para o longo prazo.'}); }

  // 4. Saldo em contas positivo (peso 15)
  max += 15;
  if(contasSaldo>0){ pontos+=15; sinais.push({ok:true,txt:'Saldo em contas positivo.'}); }
  else if(contasSaldo===0){ pontos+=7; }
  else { sinais.push({ok:false,txt:'Saldo em contas negativo — evite o cheque especial.'}); }

  // 5. Uso do cartão de crédito (peso 10)
  max += 10;
  if(cartoesUso===null){ pontos+=10; }
  else if(cartoesUso<=0.3){ pontos+=10; sinais.push({ok:true,txt:`Uso do limite do cartão em ${fmtPct(cartoesUso)} — confortável.`}); }
  else if(cartoesUso<=0.6){ pontos+=6; sinais.push({ok:true,txt:`Uso do cartão em ${fmtPct(cartoesUso)}.`}); }
  else if(cartoesUso<=0.9){ pontos+=3; sinais.push({ok:false,txt:`Cartão em ${fmtPct(cartoesUso)} do limite — atenção ao endividamento.`}); }
  else { sinais.push({ok:false,txt:`Cartão quase no limite (${fmtPct(cartoesUso)}) — risco alto.`}); }

  const nota = max>0 ? Math.round(pontos/max*100) : 0;
  let status, cor, resumo;
  if(nota>=75){ status='Saudável'; cor='var(--pos)'; resumo='Suas finanças estão em boa forma. Continue assim e foque em fazer o patrimônio crescer.'; }
  else if(nota>=50){ status='Atenção'; cor='var(--gold-dim)'; resumo='Suas finanças estão razoáveis, mas há pontos a melhorar para ganhar folga.'; }
  else { status='Crítico'; cor='var(--neg)'; resumo='Sinais de alerta. Vale rever os gastos e priorizar o equilíbrio do orçamento.'; }
  return {nota,status,cor,resumo,sinais};
}

/* ============================================================
   HERO 3D CANVAS
   ============================================================ */
function HeroCanvas() {
  const canvasRef = useRef(null);
  useEffect(()=>{
    const canvas = canvasRef.current; if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf, t=0;
    const resize=()=>{canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;};
    resize();
    const ro=new ResizeObserver(resize); ro.observe(canvas);
    // Generate particles
    const particles = Array.from({length:55},()=>({
      x:Math.random(),y:Math.random(),
      vx:(Math.random()-.5)*.00018,vy:(Math.random()-.5)*.00018,
      r:Math.random()*1.8+.4,
      opacity:Math.random()*.5+.15,
      phase:Math.random()*Math.PI*2
    }));
    // Hexagonal grid nodes
    const nodes=[];
    for(let i=0;i<7;i++) for(let j=0;j<4;j++){
      nodes.push({x:(i+.5*(j%2))/7,y:(j+.5)/4,s:Math.random()*.6+.2,phase:Math.random()*Math.PI*2});
    }
    function draw(){
      const W=canvas.width,H=canvas.height;
      ctx.clearRect(0,0,W,H);
      t+=.008;
      // Draw connecting lines between close particles
      particles.forEach((p,i)=>{
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0;
        if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        particles.slice(i+1).forEach(q=>{
          const dx=(p.x-q.x)*W, dy=(p.y-q.y)*H;
          const d=Math.sqrt(dx*dx+dy*dy);
          if(d<90){
            const a=(1-d/90)*.12;
            ctx.beginPath();
            ctx.moveTo(p.x*W,p.y*H);
            ctx.lineTo(q.x*W,q.y*H);
            ctx.strokeStyle=`rgba(184,136,42,${a})`;
            ctx.lineWidth=.6;
            ctx.stroke();
          }
        });
        // Draw particle
        const pulse=.5+.5*Math.sin(t*1.2+p.phase);
        ctx.beginPath();
        ctx.arc(p.x*W,p.y*H,p.r*(1+pulse*.3),0,Math.PI*2);
        ctx.fillStyle=`rgba(184,136,42,${p.opacity*(.6+pulse*.4)})`;
        ctx.fill();
      });
      // Draw rotating ring in top-right
      const cx=W*.85,cy=H*.25,maxR=Math.min(W,H)*.18;
      for(let ring=0;ring<3;ring++){
        const rad=maxR*(ring+1)/3;
        const segs=12+ring*6;
        for(let s=0;s<segs;s++){
          const a1=(s/segs)*Math.PI*2+t*(ring%2===0?.15:-.1)+ring;
          const a2=((s+.65)/segs)*Math.PI*2+t*(ring%2===0?.15:-.1)+ring;
          const alpha=(.25-.08*ring)*(1+.3*Math.sin(t*2+s+ring));
          ctx.beginPath();
          ctx.arc(cx,cy,rad,a1,a2);
          ctx.strokeStyle=`rgba(184,136,42,${alpha})`;
          ctx.lineWidth=1+ring*.5;
          ctx.lineCap='round';
          ctx.stroke();
        }
      }
      // Small dots on ring intersections
      for(let ring=0;ring<3;ring++){
        const rad=maxR*(ring+1)/3;
        const segs=12+ring*6;
        for(let s=0;s<segs;s+=3){
          const a=s/segs*Math.PI*2+t*(ring%2===0?.15:-.1)+ring;
          const px=cx+Math.cos(a)*rad, py=cy+Math.sin(a)*rad;
          const glow=ctx.createRadialGradient(px,py,0,px,py,4);
          glow.addColorStop(0,'rgba(184,136,42,.5)');
          glow.addColorStop(1,'rgba(184,136,42,0)');
          ctx.beginPath(); ctx.arc(px,py,3,0,Math.PI*2);
          ctx.fillStyle=glow; ctx.fill();
        }
      }
      raf=requestAnimationFrame(draw);
    }
    draw();
    return()=>{cancelAnimationFrame(raf);ro.disconnect();};
  },[]);
  return React.createElement('canvas',{ref:canvasRef,className:'premium-hero-canvas'});
}

/* ============================================================
   DONUT CHART
   ============================================================ */
function DonutChart({data:slices,size=140}) {
  const canvasRef=useRef(null);
  const [hover,setHover]=useState(-1);
  const total=slices.reduce((s,d)=>s+d.v,0)||1;
  useEffect(()=>{
    const c=canvasRef.current;if(!c)return;
    const ctx=c.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    c.width=size*dpr; c.height=size*dpr;
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,size,size);
    const cx=size/2,cy=size/2,or=size/2-6,ir=or*.56;
    let angle=-Math.PI/2;
    slices.forEach((s,i)=>{
      const sweep=s.v/total*Math.PI*2;
      const isH=i===hover;
      const r=isH?or+4:or;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(angle)*ir,cy+Math.sin(angle)*ir);
      ctx.arc(cx,cy,r,angle,angle+sweep);
      ctx.arc(cx,cy,ir,angle+sweep,angle,true);
      ctx.closePath();
      ctx.fillStyle=s.color;
      ctx.globalAlpha=isH?1:.82;
      ctx.fill();
      if(isH){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
      ctx.globalAlpha=1;
      angle+=sweep;
    });
    // Center
    ctx.beginPath(); ctx.arc(cx,cy,ir-2,0,Math.PI*2);
    ctx.fillStyle='var(--card)'; ctx.fill();
  },[slices,hover,size]);
  return React.createElement('canvas',{
    ref:canvasRef,
    style:{width:size+'px',height:size+'px',cursor:'pointer'},
    onMouseMove:e=>{
      const rect=canvasRef.current.getBoundingClientRect();
      const mx=e.clientX-rect.left-size/2,my=e.clientY-rect.top-size/2;
      const d=Math.sqrt(mx*mx+my*my);
      const cx=size/2,or=size/2-6,ir=or*.56;
      if(d<ir||d>or+6){setHover(-1);return;}
      let a=Math.atan2(my,mx)+Math.PI/2;
      if(a<0)a+=Math.PI*2;
      let cum=0,total2=slices.reduce((s,x)=>s+x.v,0)||1;
      for(let i=0;i<slices.length;i++){
        cum+=slices[i].v/total2*Math.PI*2;
        if(a<cum){setHover(i);return;}
      }
      setHover(-1);
    },
    onMouseLeave:()=>setHover(-1)
  });
}

/* ============================================================
   GRÁFICO DE EVOLUÇÃO DO PATRIMÔNIO (SVG)
   ============================================================ */
function ChartPatrimonio({hist, periodo, setPeriodo}){
  const [hover, setHover] = useState(null);
  // dimensões internas (viewBox); o SVG escala proporcional ao container
  const W=800, H=160;
  const padL=58, padR=20, padT=14, padB=30;
  const cw=W-padL-padR, ch=H-padT-padB;

  if(!hist || !hist.length) return null;
  const values = hist.map(d=>d.patrimonio);
  let min = Math.min(...values), max = Math.max(...values);
  if(max===min){ max=min+1; }
  // dar uma folga visual de 8% acima e abaixo
  const folga = (max-min)*0.08;
  min -= folga; max += folga;
  const range = max - min;

  const pts = hist.map((d,i)=>{
    const x = padL + (hist.length===1?cw/2:(i/(hist.length-1))*cw);
    const y = padT + ch - ((d.patrimonio - min)/range)*ch;
    return {x,y,d,i};
  });

  // path da linha (suave, cubic bezier entre pontos)
  const linePath = pts.map((p,i)=>{
    if(i===0) return 'M'+p.x+','+p.y;
    const prev = pts[i-1];
    const cx1 = prev.x + (p.x - prev.x)/2;
    const cx2 = prev.x + (p.x - prev.x)/2;
    return ' C'+cx1+','+prev.y+' '+cx2+','+p.y+' '+p.x+','+p.y;
  }).join('');
  const areaPath = linePath + ' L'+pts[pts.length-1].x+','+(padT+ch)+' L'+pts[0].x+','+(padT+ch)+' Z';

  // labels do eixo Y (3 níveis)
  const yLabels = [0, 0.5, 1].map(p=>{
    const v = max - p*range; // 0 = topo, 1 = base
    return {p, v};
  });

  return React.createElement('div',{style:{position:'relative'}},
    React.createElement('svg',{
      viewBox: `0 0 ${W} ${H}`,
      preserveAspectRatio: 'none',
      style:{width:'100%',height:'180px',display:'block',cursor:'crosshair'},
      onMouseMove:e=>{
        const rect = e.currentTarget.getBoundingClientRect();
        const xRatio = (e.clientX - rect.left)/rect.width;
        const xSvg = xRatio*W;
        let nearest = null, dist = 1e9;
        pts.forEach(p=>{const d=Math.abs(p.x-xSvg); if(d<dist){dist=d;nearest=p;}});
        if(nearest && dist < cw/hist.length*0.6) setHover(nearest); else setHover(null);
      },
      onMouseLeave:()=>setHover(null)
    },
      React.createElement('defs',null,
        React.createElement('linearGradient',{id:'patGrad',x1:0,y1:0,x2:0,y2:1},
          React.createElement('stop',{offset:'0%',stopColor:'#E0B655',stopOpacity:0.32}),
          React.createElement('stop',{offset:'100%',stopColor:'#E0B655',stopOpacity:0})
        )
      ),
      // grid horizontal sutil
      yLabels.map((y,i)=>React.createElement('line',{
        key:'g'+i,
        x1:padL, x2:W-padR,
        y1:padT+ch*y.p, y2:padT+ch*y.p,
        stroke:'rgba(255,255,255,.06)',strokeDasharray:'2 4'
      })),
      // labels eixo Y (valores)
      yLabels.map((y,i)=>React.createElement('text',{
        key:'yl'+i,
        x:padL-8, y:padT+ch*y.p+4,
        fontSize:9, fill:'rgba(138,142,150,.85)', textAnchor:'end',
        style:{fontFamily:'var(--font-sans)',fontFeatureSettings:'"tnum","lnum"'}
      }, fmtBRL(y.v,0).replace('R$ ',''))),
      // labels eixo X (meses) — mostra alternados para não embolar
      pts.map((p,i)=>{
        const total = hist.length;
        const passo = total<=6?1:(total<=8?2:2);
        if(i%passo!==0 && i!==total-1) return null;
        return React.createElement('text',{
          key:'xl'+i,
          x:p.x, y:H-8,
          fontSize:10, fill:'var(--muted)', textAnchor:'middle',
          style:{fontFamily:'var(--font-sans)'}
        }, p.d.mes);
      }),
      // área preenchida
      React.createElement('path',{d:areaPath, fill:'url(#patGrad)'}),
      // linha principal
      React.createElement('path',{
        d:linePath, fill:'none',
        stroke:'#E0B655', strokeWidth:2.2,
        strokeLinecap:'round', strokeLinejoin:'round',
        style:{filter:'drop-shadow(0 1px 4px rgba(224,182,85,.35))'}
      }),
      // pontos (com destaque no último)
      pts.map((p,i)=>React.createElement('circle',{
        key:'pt'+i,
        cx:p.x, cy:p.y,
        r: i===pts.length-1 ? 5 : (hover && hover.i===i ? 4.5 : 2.6),
        fill: i===pts.length-1 ? '#E0B655' : (hover && hover.i===i ? '#F2D38A' : '#C9962A'),
        stroke:'var(--card)', strokeWidth: i===pts.length-1 ? 2.5 : 1.5,
        style:{transition:'r .12s, fill .12s'}
      })),
      // linha vertical no hover
      hover && React.createElement('line',{
        x1:hover.x, x2:hover.x, y1:padT, y2:padT+ch,
        stroke:'rgba(224,182,85,.35)', strokeDasharray:'3 3'
      })
    ),
    // tooltip
    hover && React.createElement('div',{style:{
      position:'absolute',
      left:`calc(${(hover.x/W)*100}% + 8px)`,
      top:`${(hover.y/H)*100}%`,
      transform:'translateY(-50%)',
      background:'var(--obsidian)',
      border:'1px solid rgba(224,182,85,.4)',
      borderRadius:8, padding:'8px 12px',
      fontSize:11, color:'var(--ink)', pointerEvents:'none',
      boxShadow:'0 8px 24px rgba(0,0,0,.5)',
      whiteSpace:'nowrap', zIndex:10
    }},
      React.createElement('div',{style:{fontSize:9,color:'var(--muted)',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:2}}, hover.d.mes,'/',String(hover.d.ano).slice(-2)),
      React.createElement('div',{style:{fontFamily:'var(--font-display)',fontSize:15,color:'#E0B655',fontWeight:600}}, fmtBRL(hover.d.patrimonio))
    )
  );
}

function bucketsFor(per,ano,lanc,sumFn) {
  let ranges=[];
  if(per.g==='Anual') ranges=[[1,12,'Ano inteiro']];
  else if(per.g==='Semestral') ranges=[[1,6,'1º sem.'],[7,12,'2º sem.']];
  else if(per.g==='Trimestral') ranges=[[1,3,'T1'],[4,6,'T2'],[7,9,'T3'],[10,12,'T4']];
  else ranges=MESES.map((m,i)=>[i+1,i+1,m]);
  return ranges.map(([s,e,lab])=>{
    const sel=lanc.filter(l=>+l.data.slice(0,4)===ano&&+l.data.slice(5,7)>=s&&+l.data.slice(5,7)<=e);
    return {lab,rec:sumFn(sel.filter(x=>x.tipo==='Receita'),x=>x.valor),des:sumFn(sel.filter(x=>x.tipo==='Despesa'),x=>x.valor)};
  });
}

    const lcs = (data.lancamentos||[]).filter(l=>l && l.conta===c.nome);

// Dado um lançamento e o dia de fechamento do cartão,
// retorna a chave "YYYY-MM" referente ao mês de competência da fatura.
// Lançamentos após o dia de fechamento entram no mês SEGUINTE.
function mesCompetenciaFatura(dataISO, diaFechamento){
  const [y,m,d] = dataISO.split('-').map(Number);
  if(d > diaFechamento){
    // entra na fatura do próximo mês calendário
    const dt = new Date(y, m, 1); // m já é 0-based se usarmos m (JS month), mas aqui m é 1-based → next month = new Date(y, m, 1)
    return String(dt.getFullYear()).padStart(4,'0')+'-'+String(dt.getMonth()+1).padStart(2,'0');
  }
  return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0');
}

// Retorna a data de vencimento (Date) de uma fatura dado o mês de competência "YYYY-MM"
// O vencimento é no mês SEGUINTE ao mês de competência, no dia de vencimento do cartão.
function vencimentoDaFatura(mesComp, diaVencimento){
  const [y,m] = mesComp.split('-').map(Number);
  // mês seguinte ao de competência
  const dt = new Date(y, m, diaVencimento); // m é 1-based → new Date(y, m, dia) = próximo mês no JS (0-based months)
  return dt;
}

function faturasPorMes(cartao, lancamentos){
  const lcs = (lancamentos||[]).filter(l=>l && l.cartaoId===cartao.id);
  const porMes = {};
  lcs.forEach(l=>{
    if(!l.data) return;
    const chave = mesCompetenciaFatura(l.data, Number(cartao.fechamento)||1);
    if(!porMes[chave]) porMes[chave]={chave, total:0, qtd:0, lancamentos:[], vencimento:vencimentoDaFatura(chave, Number(cartao.vencimento)||10)};
    porMes[chave].total += Number(l.valor)||0;
    porMes[chave].qtd++;
    porMes[chave].lancamentos.push(l);
  });
  // ordena do mais recente para o mais antigo
  return Object.values(porMes).sort((a,b)=>b.chave.localeCompare(a.chave));
}

// Total geral (soma de todas as faturas — mantém compatibilidade com KPIs)
function faturaDoCartao(cartao, lancamentos){
  const lcs = (lancamentos||[]).filter(l=>l && l.cartaoId===cartao.id);
  const total = lcs.reduce((s,l)=>s+(Number(l.valor)||0),0);
  return {total, qtd:lcs.length, lancamentos:lcs};
}

// Formata mês de competência "YYYY-MM" → "Mês/AAAA"
function fmtMesComp(chave){
  const [y,m] = chave.split('-').map(Number);
  return MESES_EXT[m-1]+' '+y;
}
function fmtDataVenc(dt){
  if(!(dt instanceof Date)) dt = new Date(dt);
  return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear();
}

function Investimentos({ctx}) {
  const {data,setData,setToast,invAtual,invAplic} = ctx;

  const [editId,setEditId] = useState(null);
  const [atualizando,setAtualizando] = useState(false);
  const [ultimaAtualizacao,setUltimaAtualizacao] = useState(null);
  const result = invAplic>0?(invAtual-invAplic)/invAplic:0;
  const porClasse = {};

  const classes = Object.entries(porClasse).sort((a,b)=>b[1]-a[1]);
  const a = data.alavancagem;
  const alvo = (a.retirada>0 && a.rendaDesejada>0) ? a.rendaDesejada*12/a.retirada : 0;
  const rumo = alvo>0?invAtual/alvo:0;

    // Busca cotações: Brapi.dev para BR/cripto, Yahoo via proxy para internacionais
    const resultados = await Promise.allSettled(
      ativos.map(async (inv)=>{
        const ticker = inv.ticker.trim().toUpperCase();
        const classe = (inv.classe||'').toLowerCase();

        // ── Classifica o ativo ──────────────────────────────────────────────
        const isCripto = classe.includes('cripto') || ticker.endsWith('-USD') ||
          /^(BTC|ETH|SOL|BNB|ADA|XRP|DOT|AVAX|MATIC|LINK|DOGE|LTC|USDT|USDC)$/.test(ticker);
        const tickerLimpo = ticker.replace(/-USD$/i,'').replace(/\.SA$/i,'');
        const isBR = !isCripto && (
          ticker.endsWith('.SA') ||
          /^[A-Z]{4}\d{1,2}F?$/.test(tickerLimpo) ||
          /^[A-Z]{4}\d{2}$/.test(tickerLimpo)   // BDRs como AAPL34
        );

        // ── Estratégia 1: Brapi.dev (BR + cripto, sem CORS, API pública) ────
        // Documentação: https://brapi.dev/
        if(isBR || isCripto) {
          const brapiTicker = isCripto
            ? tickerLimpo+'-USD'        // BTC, ETH → BTC-USD
            : tickerLimpo;              // ITSA4, MXRF11, BOVA11
          try {
            const res = await fetch(
              `https://brapi.dev/api/quote/${encodeURIComponent(brapiTicker)}?token=a19bJmhQX6oHf2B8J6qaia`,
              {cache:'no-store', signal:AbortSignal.timeout(10000)}

        const proxies = [
          `https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`,
          `https://thingproxy.freeboard.io/fetch/${yahooUrl}`,
        ];
        let json = null;
        let lastErr = null;
        for(const proxy of proxies) {
          try {
            const res = await fetch(proxy, {cache:'no-store', signal:AbortSignal.timeout(9000)});
            if(!res.ok){lastErr=new Error('HTTP '+res.status);continue;}
            const raw = await res.json();

        }

        const meta = json.chart.result[0].meta;

      });
      return {...d, investimentos:invs};
    });

function Admin({user}) {
  const [usuarios, setUsuarios] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [erro, setErro]         = useState('');
  const [busca, setBusca]       = useState('');
  const [confirmDel, setConfirmDel] = useState(null); // id do usuário a deletar
  const [toast, setToast]       = useState('');
  const [stats, setStats]       = useState({total:0, confirmados:0, hoje:0});

  useEffect(()=>{ carregar(); },[]);
  useEffect(()=>{ if(toast){const t=setTimeout(()=>setToast(''),2500);return()=>clearTimeout(t);} },[toast]);

  async function carregar() {
    setLoading(true); setErro('');
    try {
      // Busca usuários via função admin do Supabase (requer service_role no server side)
      // Como estamos no client com anon key, usamos a tabela financa_data + auth metadata
      // A abordagem correta client-side: listar via financa_data joined com dados básicos
      const {data, error} = await sb.from('financa_data')
        .select('user_id, updated_at, payload')
        .order('updated_at', {ascending: false});
      if(error) throw error;

      // Busca sessão atual para pegar e-mail do próprio admin
      const {data:{user:me}} = await sb.auth.getUser();

      // Monta lista de usuários com dados disponíveis
      const lista = (data||[]).map(row => ({
        id: row.user_id,
        updated_at: row.updated_at,
        lancamentos: row.payload?.lancamentos?.length || 0,
        investimentos: row.payload?.investimentos?.length || 0,
        metas: row.payload?.metas?.length || 0,
        isMe: row.user_id === me?.id,
      }));

      // Tenta enriquecer com e-mails via tabela profiles (se existir)
      // ou exibe UUID com indicação do próprio admin
      setUsuarios(lista);
      const hoje = new Date().toISOString().slice(0,10);
      setStats({
        total: lista.length,
        hoje: lista.filter(u=>u.updated_at?.slice(0,10)===hoje).length,
      });
    } catch(e) {
      setErro('Erro ao carregar usuários: '+e.message);
    } finally { setLoading(false); }
  }

  async function deletarUsuario(userId) {
    try {
      // Deleta os dados do usuário (a conta em auth.users só pode ser deletada via service_role/server)
      const {error} = await sb.from('financa_data').delete().eq('user_id', userId);
      if(error) throw error;
      setUsuarios(u=>u.filter(x=>x.id!==userId));
      setConfirmDel(null);
      setToast('Dados do usuário removidos com sucesso.');
    } catch(e) {
      setErro('Erro ao remover: '+e.message);
      setConfirmDel(null);
    }
  }

              React.createElement("tbody",null,

                  ? lista.map(u=>React.createElement("tr",{key:u.id,style:{background:u.isMe?'#f0f7ff':''}},
                      React.createElement("td",{style:{fontFamily:'monospace',fontSize:11,color:'var(--muted)'}},u.id.slice(0,18)+'…'),
                      React.createElement("td",null,
                        u.isMe
                          ? React.createElement("span",{className:"pill",style:{background:'rgba(181,138,44,.15)',color:'var(--champagne)'}},"Admin (você)")
                          : React.createElement("span",{className:"pill",style:{background:'var(--tint)',color:'var(--slate)'}},"Usuário")
                      ),
                      React.createElement("td",{className:"r num"},u.lancamentos),
                      React.createElement("td",{className:"r num"},u.investimentos),
                      React.createElement("td",{className:"r num"},u.metas),
                      React.createElement("td",{style:{fontSize:12,color:'var(--muted)'}},
                        u.updated_at ? new Date(u.updated_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '—'
                      ),
                      React.createElement("td",null,
                        !u.isMe && React.createElement("button",{
                          onClick:()=>setConfirmDel(u.id),
                          style:{fontSize:11,color:'var(--neg)',fontWeight:600,padding:'3px 8px',border:'1px solid var(--neg)',borderRadius:6,background:'none',cursor:'pointer'}
                        },"Remover dados")
                      )
                    ))
                  : React.createElement("tr",null,React.createElement("td",{className:"empty",colSpan:7},"Nenhum usuário encontrado."))
              )
            )
    ),

    // Modal de confirmação de remoção
    confirmDel && React.createElement("div",{className:"modal-bg",onClick:()=>setConfirmDel(null)},
      React.createElement("div",{className:"modal",onClick:e=>e.stopPropagation(),style:{maxWidth:400}},
        React.createElement("div",{className:"modal-h"},
          React.createElement("h3",{style:{color:'var(--neg)'}},"Confirmar remoção"),
          React.createElement("button",{onClick:()=>setConfirmDel(null),style:{fontSize:22,color:'var(--muted)'}},"×")
        ),
        React.createElement("div",{className:"modal-b"},
          React.createElement("p",{style:{fontSize:14,lineHeight:1.6,marginBottom:20,color:'var(--txt)'}},
            "Isso irá remover todos os ",React.createElement("b",null,"dados financeiros"),
            " deste usuário do banco de dados. A conta de login permanece ativa — para cancelar o acesso definitivamente, remova o usuário também em ",
            React.createElement("b",null,"Authentication → Users")," no Supabase."
          ),
          React.createElement("div",{style:{display:'flex',gap:10}},
            React.createElement("button",{className:"btn btn-ghost",style:{flex:1},onClick:()=>setConfirmDel(null)},"Cancelar"),
            React.createElement("button",{className:"btn",style:{flex:1,background:'var(--neg)',color:'#fff'},onClick:()=>deletarUsuario(confirmDel)},"Confirmar remoção")
          )
        )
      )
    ),

    toast && React.createElement("div",{className:"toast"},toast)
  );
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
class ErroApp extends React.Component {
  constructor(props){ super(props); this.state={erro:null}; }
  static getDerivedStateFromError(e){ return {erro:e}; }
  componentDidCatch(e,info){ console.error('Erro na aplicação:',e,info); }
  render(){
    if(this.state.erro){
      return React.createElement("div",{style:{maxWidth:560,margin:'60px auto',padding:'32px',fontFamily:'var(--font-sans)',color:'var(--txt)'}},
        React.createElement("div",{style:{fontFamily:'var(--font-display)',fontSize:24,color:'var(--ink)',marginBottom:12}},"Algo não carregou corretamente"),
        React.createElement("p",{style:{fontSize:14,lineHeight:1.6,color:'var(--muted)',marginBottom:18}},
          "Tente recarregar a página. Se o problema continuar, pode ser um dado inconsistente — você pode recarregar a última versão salva ou, em último caso, recomeçar os dados deste navegador (suas informações na nuvem não são apagadas por aqui)."),
        React.createElement("div",{style:{display:'flex',gap:10,flexWrap:'wrap'}},
          React.createElement("button",{className:"btn btn-primary",onClick:()=>location.reload()},"Recarregar página"),
          React.createElement("button",{className:"btn btn-ghost",onClick:()=>{try{Object.keys(localStorage).filter(k=>k.startsWith("financa_")).forEach(k=>localStorage.removeItem(k));}catch(e){} location.reload();}},"Recomeçar dados locais")
        ),
        React.createElement("pre",{style:{marginTop:20,fontSize:11,color:'#b08d57',whiteSpace:'pre-wrap',background:'var(--tint)',padding:12,borderRadius:8}}, String(this.state.erro&&this.state.erro.message||this.state.erro))
      );
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ErroApp,null,React.createElement(App)));
</script>

  Execute o arquivo supabase_setup.sql no SQL Editor do Supabase.
  Ele cria a tabela financa_data com RLS para múltiplos usuários.

  CREATE TABLE IF NOT EXISTS financa_data (
    id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id    uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
    payload    jsonb NOT NULL,
    updated_at timestamptz DEFAULT now()
  );
  CREATE UNIQUE INDEX IF NOT EXISTS financa_data_user_id_idx ON financa_data(user_id);
  ALTER TABLE financa_data ENABLE ROW LEVEL SECURITY;
  CREATE POLICY "sel" ON financa_data FOR SELECT USING (auth.uid() = user_id);
  CREATE POLICY "ins" ON financa_data FOR INSERT WITH CHECK (auth.uid() = user_id);
  CREATE POLICY "upd" ON financa_data FOR UPDATE USING (auth.uid() = user_id) WITH CHECK (auth.uid() = user_id);
  CREATE POLICY "del" ON financa_data FOR DELETE USING (auth.uid() = user_id);
-->
