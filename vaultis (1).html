  -- 1. Tabela principal com RLS
  CREATE TABLE IF NOT EXISTS financa_data (
    id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id    uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
    payload    jsonb NOT NULL,
    updated_at timestamptz DEFAULT now()
  );
  CREATE UNIQUE INDEX IF NOT EXISTS financa_data_user_id_idx ON financa_data(user_id);

  -- 2. RLS obrigatório (FORCE impede bypass mesmo para table owner)
  ALTER TABLE financa_data ENABLE ROW LEVEL SECURITY;
  ALTER TABLE financa_data FORCE ROW LEVEL SECURITY;

  -- 3. Políticas de isolamento por usuário
  DROP POLICY IF EXISTS "sel" ON financa_data;
  DROP POLICY IF EXISTS "ins" ON financa_data;
  DROP POLICY IF EXISTS "upd" ON financa_data;
  DROP POLICY IF EXISTS "del" ON financa_data;
  CREATE POLICY "sel" ON financa_data FOR SELECT USING (auth.uid() = user_id);
  CREATE POLICY "ins" ON financa_data FOR INSERT WITH CHECK (auth.uid() = user_id);
  CREATE POLICY "upd" ON financa_data FOR UPDATE USING (auth.uid() = user_id) WITH CHECK (auth.uid() = user_id);
  CREATE POLICY "del" ON financa_data FOR DELETE USING (auth.uid() = user_id);

  -- 4. Função de exclusão completa (LGPD Art. 18)
  CREATE OR REPLACE FUNCTION public.excluir_conta_completa()
  RETURNS void LANGUAGE plpgsql SECURITY DEFINER AS $$
  BEGIN
    DELETE FROM financa_data WHERE user_id = auth.uid();
  END;
  $$;
  GRANT EXECUTE ON FUNCTION public.excluir_conta_completa() TO authenticated;

<style>.pwa-banner{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:200;width:calc(100% - 32px);max-width:440px;animation:.3s slideUp}.pwa-banner-inner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#131720,#1c2230);border:1px solid rgba(184,136,42,.3);border-radius:14px;padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,.5)}.pwa-banner-icon{width:42px;height:42px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,rgba(184,136,42,.15),rgba(184,136,42,.05));border:1px solid rgba(184,136,42,.3);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:18px;color:#b8882a}.pwa-banner-text{flex:1;min-width:0}.pwa-banner-title{font-size:14px;font-weight:600;color:#e8e4d8}.pwa-banner-sub{font-size:11px;color:#97948b;margin-top:2px;line-height:1.4}.pwa-banner-btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;background:linear-gradient(135deg,#b8882a,#c9962a);color:#07090c;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0}.pwa-banner-btn:hover{filter:brightness(1.1)}.pwa-banner-close{font-size:18px;color:#97948b;background:0 0;border:none;cursor:pointer;padding:4px 8px;flex-shrink:0;line-height:1}.ios-standalone .mobtab{padding-bottom:calc(6px + 20px)}.ios-standalone .fab{bottom:calc(84px + 20px)}.ios-standalone .main{padding-bottom:120px!important}@media(min-width:981px){.pwa-banner{bottom:24px}}</style>
