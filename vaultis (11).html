<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vaultis — Gestão Financeira Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Paleta Vaultis DARK: obsidiana + ouro antigo + camadas escuras ── */
  --obsidian: #07090C;
  --obsidian2: #0B0E13;
  --obsidian3: #11151B;
  --ink: #E8E4D8;
  --ink2: #C2BFB5;
  --ink3: #97948B;
  --paper: #0E1117;
  --paper2: #131720;
  --paper3: #161B25;
  --card: #161B23;
  --tint: #1C2230;
  --line: rgba(255,255,255,.06);
  --line2: rgba(255,255,255,.10);
  --ash: #1C2230;
  --gold: #C9962A;
  --gold2: #E0B655;
  --gold3: #F2D38A;
  --gold-dim: #9C7420;
  --gold-lt: rgba(201,150,42,.12);
  --champ2: #E0B655;
  --champ-dim: #9C7420;
  --champ-lt: rgba(201,150,42,.12);
  --champagne: #C9962A;
  --sage: #6DB09A;
  --sage-lt: rgba(109,176,154,.12);
  --slate: #6DB09A;
  --slate-lt: rgba(109,176,154,.12);
  --pos: #6DB09A;
  --neg: #C47070;
  --pos-lt: rgba(109,176,154,.14);
  --neg-lt: rgba(196,112,112,.14);
  --txt: #E8E4D8;
  --muted: #8A8E96;
  --muted2: #5E6168;
  --shadow-xs: 0 1px 0 rgba(255,255,255,.03) inset;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 28px rgba(0,0,0,.32);
  --shadow-md: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 48px rgba(0,0,0,.42);
  --shadow-lg: 0 1px 0 rgba(255,255,255,.05) inset, 0 32px 80px rgba(0,0,0,.55);
  --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 0 0 1px rgba(255,255,255,.04);
  --radius: 16px;
  --radius-sm: 8px;
  --radius-xs: 5px;
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-sans: 'DM Sans', 'Helvetica Neue', system-ui, sans-serif;
  --font-mono: 'DM Sans', monospace;
  --sidebar-w: 256px;
}

/* ── Modo Claro ─────────────────────────────────────────────────── */
[data-theme="light"] {
  /* Fundo principal — creme quente */
  --paper:  #F6F3EE;
  --paper2: #EDE9E2;
  --paper3: #E4DFD6;

  /* Cards e superfícies */
  --card:   #FFFFFF;
  --tint:   #EDE9E2;
  --ash:    #E8E3DA;

  /* Linhas e bordas */
  --line:   rgba(0,0,0,.09);
  --line2:  rgba(0,0,0,.15);

  /* Tipografia */
  --ink:    #1A1714;
  --ink2:   #3B3632;
  --ink3:   #6B6560;
  --txt:    #1A1714;
  --muted:  #7A7470;
  --muted2: #ABA7A2;

  /* Ouro mais escuro para contraste no claro */
  --gold:      #8A6010;
  --gold2:     #A87820;
  --gold3:     #6A4A08;
  --gold-dim:  #A87820;
  --gold-lt:   rgba(138,96,16,.10);
  --champ2:    #A87820;
  --champ-dim: #A87820;
  --champ-lt:  rgba(138,96,16,.10);
  --champagne: #8A6010;

  /* Verde e vermelho mais saturados para legibilidade */
  --sage:    #1E7A5A;
  --sage-lt: rgba(30,122,90,.10);
  --slate:   #1E7A5A;
  --slate-lt:rgba(30,122,90,.10);
  --pos:     #1E7A5A;
  --neg:     #9E3030;
  --pos-lt:  rgba(30,122,90,.10);
  --neg-lt:  rgba(158,48,48,.10);

  /* Sombras suaves */
  --shadow-xs:  0 1px 4px rgba(0,0,0,.07);
  --shadow:     0 2px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
  --shadow-md:  0 6px 24px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
  --shadow-lg:  0 12px 48px rgba(0,0,0,.13), 0 4px 12px rgba(0,0,0,.07);
  --shadow-card:0 0 0 1px rgba(0,0,0,.07), 0 2px 8px rgba(0,0,0,.05);

  /* Obsidian mantido para elementos que DEVEM ficar escuros */
  --obsidian:  #1A1714;
  --obsidian2: #252119;
  --obsidian3: #2E2A22;
}

/* Sidebar PERMANECE ESCURA no modo claro — identidade Vaultis */
[data-theme="light"] .sidebar {
  background: #111009;
  border-right-color: rgba(255,255,255,.06);
}
[data-theme="light"] .sidebar .navbtn,
[data-theme="light"] .sidebar .navbtn span {
  color: #C2BFB5;
}
[data-theme="light"] .sidebar .navbtn:hover,
[data-theme="light"] .sidebar .navbtn.active {
  background: rgba(255,255,255,.07);
  color: #F2D38A;
}
[data-theme="light"] .sidebar .navbtn.active { color: #E0B655; }
[data-theme="light"] .sidebar-logo-title { color: #E8E4D8 !important; }
[data-theme="light"] .sidebar-logo-sub   { color: #97948B !important; }
[data-theme="light"] .sidebar-logo-badge { background: #1C2230 !important; color: #E0B655 !important; }
[data-theme="light"] .sidebar-footer-brand { color: #5E6168 !important; }
[data-theme="light"] .sidebar-section-label { color: #5E6168 !important; }
[data-theme="light"] .sidebar-user-name,
[data-theme="light"] .sidebar-user-email { color: #97948B !important; }
[data-theme="light"] .sync-dot-wrap,
[data-theme="light"] .sync-label { color: #8A8E96 !important; }
[data-theme="light"] .theme-toggle {
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.12);
  color: #8A8E96;
}
[data-theme="light"] .theme-toggle:hover {
  background: rgba(255,255,255,.14);
  color: #E0B655;
  border-color: rgba(201,150,42,.4);
}

/* Inputs e selects no modo claro */
[data-theme="light"] input,
[data-theme="light"] select,
[data-theme="light"] textarea {
  color-scheme: light;
  background: #FFFFFF;
  color: #1A1714;
}
[data-theme="light"] option  { background: #fff; color: #1A1714; }
[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }

/* Modal overlay mais opaco no claro */
[data-theme="light"] .modal-overlay { background: rgba(0,0,0,.35); }

/* Tags */
[data-theme="light"] .tag.rec { background: rgba(30,122,90,.10); color: #1E7A5A; }
[data-theme="light"] .tag.des { background: rgba(158,48,48,.10); color: #9E3030; }

/* ── Botão de tema ──────────────────────────────────────────────── */
.theme-toggle {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--tint); border: 1px solid var(--line2);
  color: var(--muted); cursor: pointer; transition: all .2s;
  flex-shrink: 0;
}
.theme-toggle:hover { background: var(--card); color: var(--champagne); border-color: var(--champagne); }
.sidebar-footer-row { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 16px; gap: 8px; }
.sidebar-footer-brand { font-size: 11px; color: var(--muted2); letter-spacing: .06em; }

/* ── Mobile / App otimizações ───────────────────────────────────── */
* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
html {
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
body {
  touch-action: pan-x pan-y;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
  /* Safe area para notch / Dynamic Island / barra de home */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
button, a, [role="button"] {
  touch-action: manipulation; /* remove 300ms delay */
}
input, select, textarea {
  /* Evita zoom automático em inputs no iOS (fonte < 16px causa zoom) */
  font-size: max(16px, 14px);
}
/* Safe area na nav mobile */
.mobtab {
  padding-bottom: max(env(safe-area-inset-bottom), 6px) !important;
}
/* Safe area na sidebar */
.sidebar {
  padding-top: max(env(safe-area-inset-top), 0px);
}
/* Tablet: sidebar ligeiramente mais estreita */
@media (min-width: 768px) and (max-width: 1024px) {
  :root { --sidebar-w: 220px; }
  .sidebar { width: var(--sidebar-w); }
}

/* Evitar seleção de texto em navegação */
.mobtab, .sidebar nav, .sidebar-logo { user-select: none; -webkit-user-select: none; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--paper);
  color:var(--txt);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-weight:400;
  letter-spacing:-.01em;
}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color-scheme:dark;}
option{background:var(--card);color:var(--txt);}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--muted2)}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-sans);font-weight:500}

/* ── Layout Shell ── */
.shell{display:flex;min-height:100vh}

/* ── Sidebar — obsidiana profunda ── */
.sidebar{
  background:var(--obsidian);
  color:#6A7A8A;
  padding:0 12px 20px;
  position:fixed;top:0;left:0;
  width:var(--sidebar-w);height:100vh;
  display:flex;flex-direction:column;gap:1px;
  overflow-y:auto;
  overflow-x:hidden;
  flex-shrink:0;
  z-index:40;
}

/* Offset main content so it doesn't go under fixed sidebar */
.main-wrapper{
  margin-left:var(--sidebar-w);
  flex:1;
  min-width:0;
}
@media(max-width:980px){.main-wrapper{margin-left:0}}
.sidebar::before{
  content:'';
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(184,136,42,.07) 0%, transparent 70%),
    radial-gradient(ellipse 60% 30% at 50% 100%, rgba(184,136,42,.04) 0%, transparent 60%);
  pointer-events:none;
}
.sidebar::after{
  content:'';position:absolute;top:0;right:0;width:1px;height:100%;
  background:linear-gradient(180deg,
    transparent 0%,
    rgba(184,136,42,.25) 30%,
    rgba(184,136,42,.12) 70%,
    transparent 100%
  );
  pointer-events:none;
}

.brandrow{
  padding:28px 12px 20px;
  border-bottom:1px solid rgba(255,255,255,.04);
  margin-bottom:10px;
  position:relative;
}
.brand-logo-wrap{display:flex;align-items:center;gap:12px}
.brand-emblem{
  width:40px;height:40px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,rgba(184,136,42,.2) 0%,rgba(184,136,42,.06) 100%);
  border:1px solid rgba(184,136,42,.35);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:17px;font-weight:400;
  color:var(--gold2);letter-spacing:.02em;
  position:relative;
}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{
  font-family:var(--font-display);font-weight:400;font-size:17px;
  color:#F0EBE0;letter-spacing:.01em;line-height:1.2;
}
.brand-tagline{
  font-size:11px;font-weight:500;color:rgba(184,136,42,.5);
  letter-spacing:.18em;text-transform:uppercase;
}

.nav-section-label{
  font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.15);padding:16px 12px 4px;
}

.navbtn{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:9px;color:rgba(255,255,255,.32);font-weight:400;font-size:13px;
  width:100%;text-align:left;transition:all .16s ease;position:relative;
  letter-spacing:.01em;
}
.navbtn:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.65)}
.navbtn.active{
  background:rgba(184,136,42,.12);
  color:#F0EBE0;
}
.navbtn.active::before{
  content:'';position:absolute;left:0;top:18%;bottom:18%;width:2px;
  background:linear-gradient(180deg,var(--gold2),var(--gold-dim));
  border-radius:0 2px 2px 0;
}
.navbtn svg{width:15px;height:15px;flex:none;stroke-width:1.5;opacity:.5;transition:opacity .16s}
.navbtn.active svg{opacity:1;color:var(--gold2)}
.navbtn:hover svg{opacity:.75}

.sidebar-footer{
  margin-top:auto;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.05);
}

/* Sync indicator */
.sync-indicator{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px 3px;font-size:11px;color:rgba(255,255,255,.25);
}
.sync-dot{
  width:6px;height:6px;border-radius:50%;
  background:#4A8C6A;
  box-shadow:0 0 6px rgba(74,140,106,.5);
  transition:background .3s;
}
.sync-dot.syncing{background:#B8882A;animation:pulse .8s infinite}
.sync-dot.error{background:#8B3A3A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sidebar-footer-brand{
  font-size:11px;color:rgba(255,255,255,.12);padding:8px 12px 4px;
  letter-spacing:.06em;
}

/* ── Main ── */
.main{
  padding:40px 44px 100px;
  max-width:1280px;margin:0 auto;width:100%;
}
@media(max-width:1100px){.main{padding:32px 28px 100px}}
@media(max-width:560px){.main{padding:20px 16px 100px}}

/* ── Top bar ── */
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:32px;
}
.eyebrow{
  font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-dim);margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.eyebrow::before{
  content:'';width:16px;height:1px;
  background:linear-gradient(90deg,var(--gold),transparent);
  display:inline-block;
}
.h-title{
  font-family:var(--font-display);font-size:30px;font-weight:400;
  color:var(--ink);line-height:1.1;letter-spacing:-.02em;
}
@media(max-width:560px){.h-title{font-size:24px}}

.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selwrap{
  display:flex;align-items:center;gap:7px;
  background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 14px;
  box-shadow:var(--shadow-xs);transition:.18s;
}
.selwrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,136,42,.1)}
.selwrap label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2)}
.selwrap select{border:none;outline:none;font-weight:500;color:var(--ink);background:none;font-size:13px}

/* ── KPI cards ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:960px){.kpis{grid-template-columns:repeat(2,1fr);gap:10px}}
@media(max-width:480px){.kpis{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}}
@media(max-width:480px){
  .kpi{padding:12px 14px!important}
  .kpi .lab{font-size:11px!important;margin-bottom:2px!important}
  .kpi .val{font-size:18px!important}
  .kpi .cap{font-size:11px!important;margin-top:4px!important}
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
}

.kpi{
  padding:22px 22px 18px;position:relative;overflow:hidden;
  transition:all .22s cubic-bezier(.25,.46,.45,.94);
}
.kpi-accent{
  position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent 0%,var(--gold) 50%,transparent 100%);
  opacity:.4;
}
.kpi .lab{
  font-size:11px;font-weight:500;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin-top:2px;
}
.kpi .val{
  font-family:var(--font-display);font-size:23px;font-weight:400;
  margin-top:10px;line-height:1;letter-spacing:-.01em;
}
.kpi .cap{font-size:11px;color:var(--muted);margin-top:8px;font-weight:400;line-height:1.3}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{
  border-color:rgba(184,136,42,.35);
  box-shadow:0 8px 28px rgba(12,15,20,.10),0 0 0 1px rgba(184,136,42,.18);
  transform:translateY(-2px);
}
.kpi .cap.cta{color:var(--gold-dim);font-weight:500}

/* ── Section header & panels ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.inv-grid-main{grid-template-columns:1fr!important}}

.sec-h{
  font-size:11px;font-weight:600;color:var(--muted);
  background:var(--tint);
  padding:13px 20px 10px;
  letter-spacing:.11em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line);
}
.panel{margin-bottom:16px;overflow:hidden}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 18px}
thead th{
  background:var(--tint);color:var(--muted);font-weight:600;
  font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  border-bottom:1px solid var(--line);
}
tbody tr{border-bottom:1px solid var(--line);transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child{border-bottom:none}
td.r,th.r{text-align:right}
.bar{height:3px;border-radius:99px;background:var(--tint);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.25,.46,.45,.94)}

/* ── Tags / Chips / Pills ── */
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.04em}
.tag.rec{background:var(--pos-lt);color:var(--pos)}
.tag.des{background:var(--neg-lt);color:var(--neg)}
.tag.inv{background:var(--sage-lt);color:var(--sage)}

.chip{
  padding:7px 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:400;color:var(--muted);
  transition:all .15s;box-shadow:var(--shadow-xs);
}
.chip:hover{border-color:var(--gold);color:var(--gold-dim)}
.chip.on{
  background:var(--obsidian);color:#F0EBE0;border-color:var(--ink);
  box-shadow:0 3px 12px rgba(12,15,20,.22);
}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 18px;border-radius:9px;
  font-size:13px;font-weight:500;
  transition:all .16s;cursor:pointer;
  font-family:var(--font-sans);
}
.btn-primary{
  background:var(--obsidian);color:#F0EBE0;
  box-shadow:0 2px 8px rgba(12,15,20,.18);
}
.btn-primary:hover{background:var(--obsidian2);box-shadow:0 4px 14px rgba(12,15,20,.24)}
.btn-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--line);
}
.btn-ghost:hover{background:var(--tint);color:var(--txt);border-color:var(--muted2)}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Forms ── */
.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);
}
.field input,.field select,.field textarea{
  padding:10px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  color:var(--txt);
  font-size:14px;
  transition:.16s;
  outline:none;
  width:100%;
  font-family:var(--font-sans);
}
.field input:focus,.field select:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(184,136,42,.1);
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}

/* ── Modal ── */
.modal-bg{
  position:fixed;inset:0;z-index:100;
  background:rgba(12,15,20,.55);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:18px;
  width:100%;max-width:560px;
  box-shadow:0 32px 80px rgba(12,15,20,.28),0 0 0 1px rgba(12,15,20,.06);
  overflow:visible;display:flex;flex-direction:column;
  animation:slideUp .22s cubic-bezier(.25,.46,.45,.94);
}
@keyframes slideUp{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 16px;
  border-bottom:1px solid var(--line);
  background:var(--tint);border-radius:18px 18px 0 0;flex-shrink:0;
}
.modal-h h3{font-family:var(--font-display);font-size:20px;font-weight:400;color:var(--ink)}
.modal-b{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}

/* ── Toast ── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:var(--obsidian);color:#F0EBE0;
  padding:11px 22px;border-radius:99px;
  font-size:13px;font-weight:500;
  box-shadow:0 8px 24px rgba(12,15,20,.28);
  z-index:200;
  animation:toastIn .22s cubic-bezier(.25,.46,.45,.94);
  white-space:nowrap;
  border:1px solid rgba(184,136,42,.2);
}
@keyframes toastIn{from{transform:translateX(-50%) translateY(12px);opacity:0}to{transform:translateX(-50%);opacity:1}}

/* ── Loading screen ── */
.loading-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--paper);
}
.loading-brand{
  font-family:var(--font-display);font-size:22px;color:var(--ink);
  font-weight:400;letter-spacing:.01em;
}
.loading-sub{
  font-size:12px;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;font-weight:400;
}
.spinner{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--gold);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Back button ── */
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);cursor:pointer;
  margin-bottom:20px;padding:7px 12px;
  border-radius:8px;border:1px solid var(--line);
  background:var(--card);transition:.15s;
  font-weight:500;
}
.back-btn:hover{color:var(--txt);border-color:var(--muted2)}

/* ── Category detail header ── */
.cat-detail-header{
  background:var(--obsidian);
  border-radius:var(--radius);
  padding:28px 32px;
  margin-bottom:24px;
  position:relative;overflow:hidden;
}
.cat-detail-header::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(184,136,42,.1) 0%,transparent 70%);
}

/* ── Bar chart ── */
.barchart{
  display:grid;grid-template-columns:repeat(12,1fr);gap:6px;
  align-items:end;min-height:160px;position:relative;
  padding-top:20px;
}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.bars{display:flex;gap:2px;align-items:end;height:140px}
.bars span{
  width:7px;border-radius:3px 3px 0 0;
  min-height:2px;transition:height .5s cubic-bezier(.25,.46,.45,.94);
}
.mlab{font-size:11px;color:var(--muted);text-align:center;font-weight:500}

/* ── Note ── */
.note{font-size:12px;color:var(--muted);margin:0 4px 20px;line-height:1.6}

/* ── Empty state ── */
.empty{
  text-align:center;padding:40px;
  color:var(--muted);font-size:13px;
  font-style:italic;
}

/* ── Mobile nav ── */
.mobtab{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(14,17,23,.94);
  backdrop-filter:blur(16px) saturate(180%);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:50;
  justify-content:space-around;
  box-shadow:0 -4px 20px rgba(0,0,0,.4);
}
@media(max-width:980px){.mobtab{display:flex}}
.mobtab button{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 3px;border-radius:8px;
  font-size:11px;color:var(--muted);font-weight:500;
  flex:1 1 0;min-width:0;transition:.15s;
  letter-spacing:.02em;white-space:nowrap;
}
.mobtab button svg{width:20px;height:20px;stroke-width:1.4;transition:.15s}
.mobtab button.active{color:var(--ink)}
.mobtab button.active svg{color:var(--gold2)}
.mobtab button:hover{background:var(--tint)}
/* Mais menu popup */
.mais-overlay{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .15s ease;
}
.mais-sheet{
  width:100%;max-width:480px;
  background:var(--obsidian2);border-radius:16px 16px 0 0;
  border-top:1px solid rgba(184,136,42,.2);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(0,0,0,.5);
  animation:slideUp .2s ease;
}
.mais-sheet-handle{
  width:36px;height:4px;border-radius:3px;background:rgba(255,255,255,.15);margin:6px auto 12px;
}
.mais-sheet button{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:14px 24px;font-size:14px;color:var(--ink);font-weight:500;
  border-radius:0;transition:background .12s;
}
.mais-sheet button svg{width:20px;height:20px;color:var(--slate);flex-shrink:0}
.mais-sheet button:hover{background:rgba(255,255,255,.04)}
.mais-sheet button.active-item{color:var(--gold2)}
.mais-sheet button.active-item svg{color:var(--gold2)}
.mais-sheet-sair{color:rgba(196,112,112,.8)!important}
.mais-sheet-sair svg{color:rgba(196,112,112,.8)!important}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ── FAB (Floating Action Button) ── */
.fab{
  display:none;
  position:fixed;
  bottom:calc(64px + env(safe-area-inset-bottom));
  right:18px;
  width:52px;height:52px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);
  color:var(--obsidian);
  font-size:26px;font-weight:300;line-height:1;
  align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(201,150,42,.45),0 0 0 4px rgba(201,150,42,.12);
  cursor:pointer;transition:all .2s ease;z-index:51;
  border:none;
}
.fab:hover,.fab:active{transform:scale(1.08);box-shadow:0 6px 24px rgba(201,150,42,.55);}
@media(max-width:980px){.fab{display:flex}}

/* ── Responsivo: mobile e tablets ── */
@media(max-width:980px){
  .sidebar{display:none!important;}
  .main-wrapper{margin-left:0!important;}
}
@media(max-width:960px){
  /* Painel de saúde vira coluna */
  .health-premium{flex-direction:column!important;}
  .health-left{width:100%!important;border-right:none!important;border-bottom:1px solid var(--line);padding-bottom:18px;}
  /* Hero card */
  .premium-hero-content{flex-direction:column;gap:20px;padding:24px 20px 18px!important;}
  .premium-hero-right{border-left:none!important;padding-left:0!important;align-items:flex-start!important;width:100%;}
  .patrimonio-display{text-align:left!important;}
  .patrimonio-delta{justify-content:flex-start!important;}
  .premium-hero-title{font-size:26px!important;}
  .patrimonio-value{font-size:34px!important;}
  /* Ticker: wrapping */
  .ticker-strip{flex-wrap:wrap!important;}
  .ticker-item{flex:1 0 33%!important;padding:8px 10px!important;font-size:11px!important;}
  /* Insights do gráfico: 4 colunas viram 2x2 */
  .chart-insights{grid-template-columns:1fr 1fr!important;}
  .chart-insight:nth-child(1),.chart-insight:nth-child(3){border-right:1px solid var(--line);}
  .chart-insight:nth-child(1),.chart-insight:nth-child(2){border-bottom:1px solid var(--line);}
  .chart-insight:nth-child(2){border-right:none;}
  /* KPI */
  .kpi{padding:14px 16px!important;}
  /* Cards lado-a-lado viram empilhados */
  .grid2{grid-template-columns:1fr!important;}
  /* Tabelas com scroll horizontal */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .panel{overflow-x:auto!important;-webkit-overflow-scrolling:touch;}
  table{min-width:auto;}
  /* Modal bottom-sheet no mobile */
  .modal{max-height:92vh;border-radius:16px 16px 0 0!important;align-self:flex-end;overflow:visible!important;display:flex;flex-direction:column;}
  .modal-bg{padding:0!important;align-items:flex-end!important;}
  .modal-b{overflow-y:auto!important;-webkit-overflow-scrolling:touch;max-height:calc(92vh - 70px);padding-bottom:calc(24px + env(safe-area-inset-bottom))!important;}
  /* Tabelas mobile: ocultar colunas secundárias */
  .hide-mobile{display:none!important;}
  /* Fatura cards mobile */
  .fat-card{display:flex!important;flex-direction:column;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .fat-card:last-child{border-bottom:none;}
  .fat-card-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .fat-card-actions{display:flex;gap:8px;margin-top:4px;}
  /* Barras menores */
  .bars-3d-wrap{height:170px;}
  .bar-3d-col{min-height:160px;}
  .bar-3d-group{transform:scale(.85);}
  .bar-3d-mlab{font-size:11px;}
  .bar-3d-saldo{font-size:11px;}
  /* TOPBAR horizontal scroll para controles (filtros, periods) */
  .topbar{flex-wrap:wrap!important;gap:8px!important;}
  .controls{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap!important;scrollbar-width:none;gap:6px!important;}
  .controls::-webkit-scrollbar{display:none;}
  /* Filtros de tipo (Todos, Receita, Despesa...) */
  .filtros-tipo{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap!important;scrollbar-width:none;padding-bottom:4px;}
  .filtros-tipo::-webkit-scrollbar{display:none;}
  .filtros-tipo .btn{flex:0 0 auto;font-size:12px;padding:7px 14px;}
  /* Filtros de agrupamento */
  .filtros-grupo{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap!important;scrollbar-width:none;}
  .filtros-grupo::-webkit-scrollbar{display:none;}
  .filtros-grupo .btn{flex:0 0 auto;font-size:11px;padding:6px 12px;}
  /* Selwrap inline em controles */
  .selwrap{flex:0 0 auto!important;}
  /* Main scrollable */
  .main{overflow-x:hidden;}
}
@media(max-width:560px){
  /* Mobile compacto */
  .main{padding:16px 14px 100px!important;}
  .premium-hero-stats{gap:14px!important;flex-wrap:wrap;}
  .premium-stat{padding:0!important;flex:1 0 calc(50% - 7px);}
  .premium-stat::before{display:none!important;}
  .ticker-item{flex:1 0 50%!important;font-size:11px!important;}
  /* Painel de saúde mais compacto */
  .health-score-ring svg{width:96px!important;height:96px!important;}
  /* Header eyebrow menor */
  .h-eyebrow{font-size:12px!important;}
  /* Botões em barra ficam empilhados */
  .controls{gap:6px;}
  .btn{font-size:12px;padding:8px 12px;}
  /* Donut chart fica menor */
  .donut-wrap{flex-direction:column!important;align-items:center;}
  .donut-legend{margin-top:14px;width:100%;}
}

/* ── Auth Screen ── */
.auth-bg{
  min-height:100vh;
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  padding:20px;position:relative;overflow:hidden;
}
.auth-bg::before{
  content:'';
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 70% 50% at 20% 0%,rgba(184,136,42,.07) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 100%,rgba(74,124,110,.05) 0%,transparent 60%);
  pointer-events:none;
}
/* Subtle texture */
.auth-bg::after{
  content:'';
  position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.025'/%3E%3C/svg%3E");
  pointer-events:none;
}

.auth-card{
  background:var(--card);
  border-radius:20px;
  max-width:420px;width:100%;
  box-shadow:0 40px 80px rgba(12,15,20,.12), 0 0 0 1px rgba(12,15,20,.06);
  overflow:hidden;position:relative;
  animation:slideUp .28s cubic-bezier(.25,.46,.45,.94);
}
.auth-header{
  background:var(--obsidian);
  padding:32px 32px 26px;
  position:relative;overflow:hidden;
}
.auth-header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(184,136,42,.12) 0%,transparent 70%);
  pointer-events:none;
}
.auth-header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(184,136,42,.3),transparent);
}
.auth-body{padding:28px 32px 32px}

/* ── Donut chart (health score) ── */
.health-ring-wrap{
  position:relative;width:112px;height:112px;flex:none;
}
.health-ring-wrap svg{transform:rotate(-90deg)}
.health-score-num{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* ── Section accents ── */
.sec-accent{
  width:3px;height:20px;border-radius:99px;
  background:linear-gradient(180deg,var(--gold2),var(--gold-dim));
  flex:none;
}

/* ── Projeções / cards especiais ── */
.proj-hero{
  background:var(--obsidian);
  border-radius:var(--radius);
  padding:28px 32px;
  margin-bottom:16px;
  display:flex;align-items:center;gap:24px;
  position:relative;overflow:hidden;
}
.proj-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 100% 50%,rgba(184,136,42,.08) 0%,transparent 70%);
}

/* ── Import area ── */
.import-drop{
  border:2px dashed var(--line);border-radius:12px;padding:28px;
  text-align:center;cursor:pointer;
  transition:.2s;background:var(--tint);
}
.import-drop:hover{border-color:var(--gold);background:var(--gold-lt)}

/* ── Admin ── */
.admin-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}

/* ── Wealth banner (welcome strip) ── */
.wealth-banner{
  background:var(--obsidian);
  border-radius:var(--radius);
  padding:20px 26px;margin-bottom:24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:relative;overflow:hidden;
  border:1px solid rgba(184,136,42,.12);
}
.wealth-banner::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 80% at 110% 50%,rgba(184,136,42,.09) 0%,transparent 70%);
}
.wealth-banner-line{
  position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(184,136,42,.25),transparent);
}

/* ── 3D PREMIUM DASHBOARD ── */
.premium-hero{
  background:linear-gradient(135deg,var(--obsidian) 0%,#0E1218 100%);
  border-radius:20px;
  margin-bottom:24px;
  position:relative;overflow:hidden;
  border:1px solid rgba(184,136,42,.18);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 48px rgba(12,15,20,.12);
  min-height:240px;
  display:flex;
}
.premium-hero-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:.45;pointer-events:none;
  mask-image:radial-gradient(ellipse 80% 70% at 75% 50%,#000 0%,transparent 75%);
}
.premium-hero-content{
  position:relative;z-index:2;
  display:flex;justify-content:space-between;align-items:stretch;
  width:100%;padding:34px 38px 28px;gap:40px;flex-wrap:wrap;
}
.premium-hero-left{
  display:flex;flex-direction:column;justify-content:space-between;
  min-width:240px;flex:1;
}
.premium-hero-greeting{
  font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(184,136,42,.72);margin-bottom:14px;
  display:inline-flex;align-items:center;gap:10px;
}
.premium-hero-greeting::before{
  content:'';width:18px;height:1px;background:rgba(184,136,42,.5);
}
.premium-hero-title{
  font-family:var(--font-display);font-size:34px;font-weight:500;
  font-feature-settings:"ss01","liga","kern";font-optical-sizing:auto;
  color:#F4EFE4;line-height:1.12;letter-spacing:-.025em;
  max-width:520px;
}
.premium-hero-sub{
  font-size:12.5px;color:rgba(240,235,224,.42);margin-top:12px;
  font-weight:400;letter-spacing:.04em;
}
.premium-hero-stats{
  display:flex;gap:0;margin-top:32px;flex-wrap:wrap;
  align-items:flex-start;
}
.premium-stat{
  display:flex;flex-direction:column;gap:6px;
  padding:0 26px;position:relative;
}
.premium-stat:first-child{padding-left:0;}
.premium-stat:not(:first-child)::before{
  content:'';position:absolute;left:0;top:6px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,rgba(184,136,42,.18),transparent);
}
.premium-stat-lab{
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(240,235,224,.35);
}
.premium-stat-val{
  font-family:var(--font-display);font-size:20px;font-weight:500;
  font-feature-settings:"tnum","lnum","kern";
  letter-spacing:-.015em;line-height:1.1;
}
.premium-stat-cap{
  font-size:11px;color:rgba(240,235,224,.38);
  font-weight:400;letter-spacing:.02em;
}

/* Patrimônio (direita) */
.premium-hero-right{
  display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;
  gap:18px;flex-shrink:0;min-width:220px;
  padding-left:24px;border-left:1px solid rgba(184,136,42,.1);
}
.patrimonio-display{
  text-align:right;
}
.patrimonio-label{
  font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(184,136,42,.55);margin-bottom:8px;
}
.patrimonio-value{
  font-family:var(--font-display);font-size:42px;font-weight:500;
  font-feature-settings:"tnum","lnum","kern";font-optical-sizing:auto;
  color:#E8C97A;letter-spacing:-.028em;line-height:1;
}
.patrimonio-delta{
  font-size:11.5px;font-weight:500;margin-top:10px;
  font-feature-settings:"tnum","lnum";
  display:flex;align-items:center;gap:6px;justify-content:flex-end;
}
.hero-cta{
  padding:9px 20px;border-radius:9px;
  border:1px solid rgba(184,136,42,.4);
  color:#E8C97A;font-size:12px;font-weight:500;
  cursor:pointer;transition:all .2s ease;
  background:rgba(184,136,42,.06);
  letter-spacing:.04em;
  font-family:var(--font-sans);
}
.hero-cta:hover{
  background:rgba(184,136,42,.14);border-color:rgba(184,136,42,.6);
  transform:translateY(-1px);
}

/* Ticker strip refinado */
.ticker-strip{
  display:flex;gap:0;overflow:hidden;padding:0;
  font-size:11px;color:rgba(240,235,224,.5);
  border-top:1px solid rgba(184,136,42,.12);
  background:rgba(0,0,0,.18);
  position:relative;z-index:2;
}
.ticker-item{
  display:flex;gap:8px;align-items:center;white-space:nowrap;
  padding:11px 22px;flex:1;justify-content:center;
  border-right:1px solid rgba(184,136,42,.06);
  font-feature-settings:"tnum","lnum";
}
.ticker-item:last-child{border-right:none;}
.ticker-item > span:first-child{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(240,235,224,.32);
}
.ticker-up{color:#6DB09A;font-weight:600;font-size:12.5px;}
.ticker-down{color:#C47070;font-weight:600;font-size:12.5px;}

/* 3D KPI Cards */
.kpi-3d{
  padding:22px 22px 18px;position:relative;overflow:hidden;
  transition:all .28s cubic-bezier(.25,.46,.45,.94);
  transform-style:preserve-3d;
  cursor:default;
}
.kpi-3d::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 60%);
  border-radius:inherit;pointer-events:none;
  transition:opacity .28s;
}
.kpi-3d:hover{
  transform:translateY(-4px) rotateX(2deg);
  box-shadow:0 14px 36px rgba(12,15,20,.14),0 0 0 1px rgba(184,136,42,.22);
}
.kpi-3d.clickable{cursor:pointer;}
.kpi-3d .kpi-shimmer{
  position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse 40% 40% at 50% 50%,rgba(184,136,42,.06),transparent 70%);
  animation:shimmerRot 8s linear infinite;
  pointer-events:none;
}
@keyframes shimmerRot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* 3D Chart */
.chart-3d-container{
  padding:16px 20px 20px;
}
.bars-3d-wrap{
  display:grid;grid-template-columns:repeat(12,1fr);gap:6px;
  align-items:end;height:210px;position:relative;padding-top:20px;
  margin-bottom:8px;
}
.bar-3d-col{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:200px;justify-content:flex-end;
}
.bar-3d-group{
  display:flex;gap:2px;align-items:end;
  perspective:200px;
}
.bar-3d{
  border-radius:4px 4px 0 0;
  position:relative;
  transition:height .6s cubic-bezier(.25,.46,.45,.94),opacity .3s;
  min-height:2px;
  transform-origin:bottom center;
}
.bar-3d::after{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:6px;
  border-radius:4px 4px 0 0;
  background:rgba(255,255,255,.22);
  pointer-events:none;
}
.bar-3d.rec{
  background:linear-gradient(180deg,#85C2AD,#5E9E89 60%,#4A8472);
  box-shadow:0 0 12px rgba(109,176,154,.35);
}
.bar-3d.des{
  background:linear-gradient(180deg,#D88787,#B96565 60%,#9C5050);
  box-shadow:0 0 12px rgba(196,112,112,.30);
}
.bar-3d-col:hover .bar-3d{opacity:.85;transform:scaleY(1.03);transform-origin:bottom;}
.bar-3d-mlab{font-size:11px;color:var(--ink2);font-weight:600;text-align:center;letter-spacing:.02em;}
.bar-3d-saldo{font-size:11px;font-weight:700;height:14px;line-height:14px;text-align:center;color:var(--gold2);}

/* Insights do gráfico (ocupa o espaço inferior) */
.chart-insights{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  margin:14px -20px -20px;
  background:rgba(255,255,255,.018);
  border-top:1px solid var(--line);
  border-radius:0 0 var(--radius) var(--radius);
}
.chart-insight{
  padding:14px 16px;text-align:left;
  border-right:1px solid var(--line);
}
.chart-insight:last-child{border-right:none;}
.chart-insight-lab{
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px;
}
.chart-insight-val{
  font-family:var(--font-display);font-size:18px;font-weight:500;
  letter-spacing:-.01em;color:var(--ink);line-height:1.1;
  font-feature-settings:"tnum","lnum";
}
.chart-insight-cap{
  font-size:11px;color:var(--muted);margin-top:3px;
}

/* Categoria rings */
.cat-rings-wrap{
  padding:16px 20px;
  display:flex;flex-direction:column;gap:10px;
}
.cat-ring-row{
  display:flex;align-items:center;gap:12px;
  cursor:pointer;padding:7px 10px;border-radius:8px;
  transition:background .15s;
}
.cat-ring-row:hover{background:rgba(245,242,235,.7)}
.cat-ring-name{font-size:13px;font-weight:400;flex:1;color:var(--txt)}
.cat-ring-val{font-size:13px;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums;}
.cat-ring-bar-wrap{width:100px;height:5px;background:var(--line);border-radius:99px;overflow:hidden;flex-shrink:0;}
.cat-ring-bar-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.25,.46,.45,.94);}
.cat-ring-pct{font-size:11px;color:var(--muted);width:32px;text-align:right;}
.cat-ring-icon{
  width:28px;height:28px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}

/* Donut chart premium */
.donut-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:20px;gap:24px;flex-wrap:wrap;
}
.donut-legend{display:flex;flex-direction:column;gap:8px;min-width:140px;}
.donut-legend-item{display:flex;align-items:center;gap:8px;cursor:pointer;}
.donut-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.donut-legend-lab{font-size:12px;color:var(--txt);font-weight:400;}
.donut-legend-pct{font-size:11px;color:var(--muted);margin-left:auto;font-weight:500;}

/* Health card premium */
.health-premium{
  display:flex;gap:0;flex-wrap:wrap;
  border-radius:var(--radius);overflow:hidden;
}
.health-left{
  flex:0 0 auto;width:180px;
  background:linear-gradient(160deg,var(--obsidian) 0%,var(--obsidian2) 100%);
  padding:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  position:relative;overflow:hidden;
  border-right:1px solid rgba(184,136,42,.12);
}
.health-left::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 80% at 50% 0%,rgba(184,136,42,.1),transparent 70%);
}
.health-right{flex:1;min-width:280px;padding:20px 24px;}
.health-score-ring{position:relative;width:110px;height:110px;}
.health-score-inner{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
}
.health-score-inner .n{
  font-family:var(--font-display);font-size:30px;font-weight:400;line-height:1;
}
.health-score-inner .s{font-size:11px;color:rgba(240,235,224,.4);letter-spacing:.06em;text-transform:uppercase;}

/* Comparativo table premium */
.comp-table-premium{width:100%;border-collapse:collapse;font-size:13px;}
.comp-table-premium th{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);padding:10px 16px 8px;
  border-bottom:1px solid var(--line);background:var(--tint);
}
.comp-table-premium td{padding:10px 16px;border-bottom:1px solid rgba(232,227,216,.6);}
.comp-table-premium tbody tr:last-child td{border-bottom:none;}
.comp-table-premium tbody tr:hover td{background:rgba(245,242,235,.5);}
.comp-row-saldo-pos{color:var(--pos);font-weight:700;}
.comp-row-saldo-neg{color:var(--neg);font-weight:700;}

/* Animated number */
@keyframes countUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim-num{animation:countUp .5s cubic-bezier(.25,.46,.45,.94) both;}

/* Pulse dot for live feel */
.live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--pos);
  box-shadow:0 0 0 2px rgba(46,107,82,.2);
  animation:livePulse 2s ease infinite;
  display:inline-block;
}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 2px rgba(46,107,82,.2)}50%{box-shadow:0 0 0 6px rgba(46,107,82,.0)}}

/* Period selector pills in header */
.period-pill-row{display:flex;gap:6px;flex-wrap:wrap;}
.period-pill{
  padding:5px 12px;border-radius:999px;font-size:11px;font-weight:500;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  cursor:pointer;transition:all .14s;
}
.period-pill:hover{border-color:var(--gold);color:var(--gold-dim);}
.period-pill.on{background:var(--obsidian);color:#F0EBE0;border-color:var(--ink);}

/* Ticker strip */
/* DRE Lines */
.dre-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 20px;border-bottom:1px solid rgba(232,227,216,.5);
  transition:background .12s;gap:12px;
}
.dre-line:hover{background:rgba(245,242,235,.6);}
.dre-line.sub{
  background:var(--tint);font-weight:700;font-size:13px;
  padding:10px 20px;border-bottom:1px solid var(--line);
}
.dre-line.ind{font-size:13px;font-weight:400;color:var(--txt);padding-left:36px;}

/* Allocation bar 3D */
.alloc-bar-wrap{width:90px;height:5px;background:var(--line);border-radius:99px;overflow:hidden;flex-shrink:0;}
.alloc-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--slate),var(--sage));transition:width .7s cubic-bezier(.25,.46,.45,.94);}

/* Meta progress 3D */
.meta-prog-wrap{height:7px;background:rgba(12,15,20,.06);border-radius:99px;overflow:hidden;flex:1;min-width:80px;position:relative;}
.meta-prog-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.25,.46,.45,.94);position:relative;overflow:hidden;}
.meta-prog-fill::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmerSlide 2.5s ease infinite;}
@keyframes shimmerSlide{from{left:-60%}to{left:160%}}

/* Projeções chart 3D */
.proj-bars-3d{display:flex;gap:3px;align-items:flex-end;height:160px;position:relative;padding-top:16px;overflow-x:auto;}
.proj-bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;min-width:22px;}
.proj-bar-3d{width:16px;border-radius:4px 4px 0 0;transition:height .6s cubic-bezier(.25,.46,.45,.94);position:relative;cursor:default;}
.proj-bar-3d.patrimonio{background:linear-gradient(180deg,#4A8C6A,rgba(74,140,106,.55));box-shadow:2px 0 8px rgba(74,140,106,.25);}
.proj-bar-3d.investido{background:linear-gradient(180deg,rgba(184,136,42,.7),rgba(184,136,42,.3));}
.proj-bar-3d::after{content:'';position:absolute;top:0;left:0;right:0;height:5px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.2);}
.proj-bar-3d-label{font-size:11px;color:var(--muted);font-weight:600;text-align:center;}

/* Categoria hist 3D */
.cat-hist-wrap{padding:14px 16px 10px;display:flex;gap:4px;align-items:flex-end;height:140px;}
.cat-hist-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.cat-hist-bar{width:100%;max-width:24px;border-radius:4px 4px 0 0;position:relative;transition:height .6s cubic-bezier(.25,.46,.45,.94);}
.cat-hist-bar::after{content:'';position:absolute;top:0;left:0;right:0;height:5px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.15);}
.cat-hist-mlab{font-size:11px;color:var(--muted);font-weight:600;}

/* DRE waterfall 3D */
.dre-waterfall-wrap{padding:16px 20px 12px;display:flex;gap:6px;align-items:flex-end;height:160px;overflow-x:auto;}
.dre-wf-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;min-width:56px;}
.dre-wf-bar{width:40px;border-radius:4px 4px 0 0;position:relative;transition:height .6s cubic-bezier(.25,.46,.45,.94);cursor:default;}
.dre-wf-bar::after{content:'';position:absolute;top:0;left:0;right:0;height:5px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.18);}
.dre-wf-label{font-size:11px;color:var(--muted);font-weight:600;text-align:center;line-height:1.3;}

/* ── Acessibilidade ── */
/* Touch targets mínimo 44px em dispositivos touch */
@media(pointer:coarse){
  button:not(.chip):not(.pill),a[role="button"],select{min-height:44px;}
  input,select,textarea{min-height:44px;}
  .mobtab button{min-height:48px;min-width:48px;}
}
/* Screen reader only */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0;}
/* Focus visible para navegação por teclado */
:focus-visible{outline:2px solid var(--slate);outline-offset:2px;border-radius:4px;}
/* Respeitar preferência de movimento reduzido */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

/* ══════════════════════════════════════════════════════════════════
   VAULTIS PREMIUM VISUAL ENHANCEMENT LAYER
   Refinamentos de profundidade, animação e requinte visual
   ══════════════════════════════════════════════════════════════════ */

/* ── Grain texture overlay global ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: .028;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='1'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}
[data-theme="light"] body::after { opacity: .018; }

/* ── Scrollbar premium ── */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, rgba(184,136,42,.25), rgba(184,136,42,.08));
  border-radius: 99px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(184,136,42,.4); }

/* ── Entrada animada da página principal ── */
@keyframes vltPageIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.main { animation: vltPageIn .45s cubic-bezier(.22,.68,0,1.2) both; }

/* ── Cards: profundidade e brilho aprimorados ── */
.card {
  transition: box-shadow .25s ease, border-color .25s ease, transform .25s ease;
  will-change: transform;
}
.card:hover {
  box-shadow: 0 4px 28px rgba(0,0,0,.18), 0 0 0 1px rgba(184,136,42,.1);
}
[data-theme="light"] .card:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,.07), 0 0 0 1px rgba(138,96,16,.12);
}

/* ── KPI cards: shimmer ao hover ── */
.kpi {
  overflow: hidden;
  isolation: isolate;
}
.kpi::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(184,136,42,.055) 0%, transparent 55%);
  opacity: 0;
  transition: opacity .3s ease;
  pointer-events: none;
  border-radius: inherit;
}
.kpi:hover::after { opacity: 1; }
.kpi .val {
  letter-spacing: -.025em;
  transition: color .2s;
}
.kpi.clickable:hover .val { color: var(--gold2); }

/* ── KPI 3D: hover glow refinado ── */
.kpi-3d:hover {
  box-shadow: 0 0 0 1px rgba(184,136,42,.24),
              0 14px 36px rgba(12,15,20,.16),
              0 0 60px rgba(184,136,42,.06);
}

/* ── Sidebar: refinamentos ── */
.sidebar {
  transition: width .2s ease;
}
.navbtn {
  position: relative;
  overflow: hidden;
}
.navbtn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(184,136,42,.1) 0%, transparent 60%);
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
}
.navbtn:hover::after { opacity: 1; }
.navbtn.active {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.brand-emblem {
  position: relative;
  overflow: hidden;
}
.brand-emblem::after {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent 0%, rgba(184,136,42,.15) 30%, transparent 60%);
  animation: emblemSpin 8s linear infinite;
  pointer-events: none;
}
@keyframes emblemSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ── Botões: elevação e glow ── */
.btn {
  position: relative;
  overflow: hidden;
  transition: all .18s cubic-bezier(.25,.46,.45,.94);
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, transparent 60%);
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
  border-radius: inherit;
}
.btn:hover::after { opacity: 1; }
.btn:active { transform: scale(.97); }
.btn-primary {
  background: linear-gradient(160deg, #1A1E28 0%, var(--obsidian) 100%);
  box-shadow: 0 2px 8px rgba(12,15,20,.22), inset 0 1px 0 rgba(255,255,255,.07);
}
.btn-primary:hover {
  box-shadow: 0 6px 18px rgba(12,15,20,.3), inset 0 1px 0 rgba(255,255,255,.07);
  transform: translateY(-1px);
}
.btn-ghost {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
}
.btn-ghost:hover { transform: translateY(-1px); }

/* ── Inputs: foco premium com glow dourado ── */
.field input, .field select, .field textarea {
  background: var(--obsidian3);
  transition: all .2s ease;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.15);
}
[data-theme="light"] .field input,
[data-theme="light"] .field select,
[data-theme="light"] .field textarea {
  background: #FAFAF8;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.05);
}
.field input:focus, .field select:focus {
  border-color: var(--gold2);
  box-shadow: 0 0 0 3px rgba(184,136,42,.12), inset 0 1px 3px rgba(0,0,0,.1);
}
.field input::placeholder { color: var(--muted2); opacity: .7; }

/* ── Modal: backdrop blur reforçado ── */
.modal-bg {
  background: rgba(5,7,11,.65);
  backdrop-filter: blur(12px) saturate(150%);
}
.modal {
  box-shadow:
    0 0 0 1px rgba(184,136,42,.1),
    0 4px 6px rgba(0,0,0,.1),
    0 20px 60px rgba(0,0,0,.38),
    0 60px 120px rgba(0,0,0,.22);
  border: 1px solid rgba(255,255,255,.06);
}
.modal-h {
  background: linear-gradient(135deg, var(--obsidian2) 0%, var(--tint) 100%);
}
.modal-h h3 {
  letter-spacing: -.02em;
}
[data-theme="light"] .modal-h {
  background: linear-gradient(135deg, #E8E3DA 0%, var(--tint) 100%);
}

/* ── Toast refinado ── */
.toast {
  background: linear-gradient(135deg, var(--obsidian) 0%, #0D1018 100%);
  box-shadow:
    0 0 0 1px rgba(184,136,42,.18),
    0 8px 32px rgba(0,0,0,.35),
    0 0 24px rgba(184,136,42,.06);
  letter-spacing: .02em;
}

/* ── Hero card: textura e profundidade extra ── */
.premium-hero {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    inset 0 -1px 0 rgba(0,0,0,.3),
    0 2px 4px rgba(0,0,0,.12),
    0 24px 60px rgba(0,0,0,.18);
}
.premium-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 50% 80% at 100% 50%, rgba(184,136,42,.07) 0%, transparent 70%),
    radial-gradient(ellipse 30% 50% at 0% 100%, rgba(74,140,106,.04) 0%, transparent 60%);
  pointer-events: none;
}
.patrimonio-value {
  text-shadow: 0 0 40px rgba(228,182,85,.12);
  position: relative;
}

/* ── Ticker strip: shimmer animado ── */
.ticker-item {
  position: relative;
  overflow: hidden;
}
.ticker-item::after {
  content: '';
  position: absolute;
  top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(184,136,42,.04), transparent);
  animation: tickerShimmer 4s ease infinite;
}
.ticker-item:nth-child(2)::after { animation-delay: .8s; }
.ticker-item:nth-child(3)::after { animation-delay: 1.6s; }
.ticker-item:nth-child(4)::after { animation-delay: 2.4s; }
@keyframes tickerShimmer { from { left: -60%; } to { left: 120%; } }

/* ── Tabelas: hover refinado ── */
tbody tr {
  transition: background .15s ease, box-shadow .15s ease;
}
tbody tr:hover {
  background: rgba(184,136,42,.04) !important;
  box-shadow: inset 3px 0 0 rgba(184,136,42,.3);
}
[data-theme="light"] tbody tr:hover {
  background: rgba(138,96,16,.03) !important;
  box-shadow: inset 3px 0 0 rgba(138,96,16,.25);
}
thead th {
  font-size: 10.5px;
  letter-spacing: .14em;
}

/* ── Section header: linha dourada ── */
.sec-h {
  position: relative;
}
.sec-h::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, rgba(184,136,42,.15) 0%, transparent 60%);
}

/* ── Panel: borda dourada sutil no topo ── */
.panel {
  position: relative;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 16px; right: 16px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(184,136,42,.12), transparent);
  pointer-events: none;
}

/* ── Tags: glow e refinamento ── */
.tag.rec {
  box-shadow: 0 0 0 1px rgba(109,176,154,.2), 0 0 8px rgba(109,176,154,.08);
}
.tag.des {
  box-shadow: 0 0 0 1px rgba(196,112,112,.2), 0 0 8px rgba(196,112,112,.08);
}
.tag {
  letter-spacing: .06em;
  text-transform: uppercase;
  font-size: 10.5px;
}

/* ── Chip: brilho ao selecionar ── */
.chip.on {
  box-shadow: 0 3px 12px rgba(12,15,20,.25), 0 0 0 1px rgba(184,136,42,.2);
}

/* ── Progress bars: shimmer ── */
.bar > i {
  position: relative;
  overflow: hidden;
}
.bar > i::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
  animation: barShimmer 2.2s ease infinite;
}
@keyframes barShimmer { from { left: -60%; } to { left: 160%; } }

/* ── Loading screen: refinada ── */
.loading-screen {
  background: var(--obsidian);
  background-image:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(184,136,42,.06) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 100%, rgba(74,140,106,.03) 0%, transparent 60%);
}
.loading-brand {
  letter-spacing: .04em;
  font-size: 24px;
}
.spinner {
  border-width: 1.5px;
  border-top-color: var(--gold2);
  box-shadow: 0 0 12px rgba(184,136,42,.2);
}

/* ── Auth screen: card premium ── */
.auth-card {
  box-shadow:
    0 0 0 1px rgba(184,136,42,.1),
    0 40px 80px rgba(0,0,0,.3),
    0 0 60px rgba(184,136,42,.04);
}
.auth-card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(184,136,42,.4), transparent);
  pointer-events: none;
  z-index: 10;
}

/* ── Wealth banner: glow e brilho extra ── */
.wealth-banner {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 8px 24px rgba(0,0,0,.15),
    0 0 40px rgba(184,136,42,.04);
}

/* ── Cat detail header: depth ── */
.cat-detail-header {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 12px 32px rgba(0,0,0,.2);
}

/* ── Proj hero: shadow ── */
.proj-hero {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 8px 24px rgba(0,0,0,.16);
}

/* ── Meta progress: glow ── */
.meta-prog-fill {
  box-shadow: 0 0 8px rgba(184,136,42,.25);
}

/* ── Health score ring: glow ── */
.health-left {
  box-shadow: inset -1px 0 20px rgba(184,136,42,.04);
}

/* ── Donut legend hover ── */
.donut-legend-item {
  padding: 3px 6px;
  border-radius: 6px;
  transition: background .15s;
}
.donut-legend-item:hover { background: rgba(184,136,42,.06); }

/* ── Eyebrow: line animada ── */
.eyebrow::before {
  background: linear-gradient(90deg, var(--gold2), transparent);
  width: 20px;
  transition: width .3s ease;
}
.eyebrow:hover::before { width: 28px; }

/* ── Period pill: glow on ── */
.period-pill.on {
  box-shadow: 0 2px 12px rgba(12,15,20,.22), 0 0 0 1px rgba(184,136,42,.15);
}

/* ── Mais sheet: blur ── */
.mais-overlay { backdrop-filter: blur(8px); }
.mais-sheet {
  box-shadow:
    0 -8px 40px rgba(0,0,0,.5),
    0 0 0 1px rgba(184,136,42,.1);
}

/* ── Import drop: premium ── */
.import-drop {
  transition: all .2s ease;
}
.import-drop:hover {
  border-color: var(--gold2);
  background: var(--gold-lt);
  box-shadow: 0 0 0 4px rgba(184,136,42,.04);
}

/* ── FAB: pulse ring ── */
.fab {
  position: relative;
}
.fab::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1.5px solid rgba(201,150,42,.3);
  animation: fabRing 2.5s ease infinite;
}
@keyframes fabRing {
  0%, 100% { transform: scale(1); opacity: .6; }
  50%       { transform: scale(1.12); opacity: 0; }
}

/* ── Sync dot: pulse dourado ── */
.sync-dot {
  box-shadow: 0 0 8px rgba(74,140,106,.4);
}

/* ── DRE lines: hover refinado ── */
.dre-line:hover {
  background: rgba(184,136,42,.04) !important;
}

/* ── Cat ring row: hover premium ── */
.cat-ring-row:hover {
  background: rgba(184,136,42,.05) !important;
}

/* ── Back btn: refinado ── */
.back-btn:hover {
  color: var(--ink);
  border-color: rgba(184,136,42,.35);
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

/* ── Animação de entrada stagger para KPIs ── */
@keyframes vltFadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.kpis .card:nth-child(1) { animation: vltFadeUp .38s cubic-bezier(.22,.68,0,1.1) .08s both; }
.kpis .card:nth-child(2) { animation: vltFadeUp .38s cubic-bezier(.22,.68,0,1.1) .15s both; }
.kpis .card:nth-child(3) { animation: vltFadeUp .38s cubic-bezier(.22,.68,0,1.1) .22s both; }
.kpis .card:nth-child(4) { animation: vltFadeUp .38s cubic-bezier(.22,.68,0,1.1) .29s both; }

/* ── Topbar: entrada suave ── */
.topbar { animation: vltFadeUp .35s cubic-bezier(.22,.68,0,1.1) .04s both; }

/* ── Hero premium: entrada ── */
.premium-hero { animation: vltFadeUp .42s cubic-bezier(.22,.68,0,1.2) .01s both; }
.wealth-banner { animation: vltFadeUp .38s cubic-bezier(.22,.68,0,1.1) .05s both; }

/* ── Selwrap: hover refinado ── */
.selwrap {
  transition: all .2s ease;
}
.selwrap:hover {
  border-color: rgba(184,136,42,.3);
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

/* ── Número animado: contup glow ── */
.anim-num {
  animation: countUp .55s cubic-bezier(.22,.68,0,1.2) both;
}

/* ── Grid 2: animação stagger ── */
.grid2 > .card:nth-child(1) { animation: vltFadeUp .4s cubic-bezier(.22,.68,0,1.1) .18s both; }
.grid2 > .card:nth-child(2) { animation: vltFadeUp .4s cubic-bezier(.22,.68,0,1.1) .26s both; }

/* ── Live dot: glow verde ── */
.live-dot {
  box-shadow: 0 0 0 2px rgba(46,107,82,.2), 0 0 6px rgba(109,176,154,.3);
}

/* ── Barra de alocação: glow ── */
.alloc-bar-fill {
  box-shadow: 0 0 8px rgba(109,176,154,.2);
}

/* ── Tipografia: refinamentos globais ── */
h1, h2, h3 {
  font-optical-sizing: auto;
  font-feature-settings: "ss01","liga","kern";
}
.h-title {
  font-weight: 400;
  text-shadow: 0 1px 20px rgba(184,136,42,.04);
}
.num {
  font-feature-settings: "tnum","lnum","kern";
}
th {
  font-feature-settings: "cpsp","kern";
}

/* PWA Install Banner */
.pwa-banner{
  position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);

  animation:slideUp .3s ease;
}
.pwa-banner-inner{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#131720,#1C2230);
  border:1px solid rgba(184,136,42,.3);border-radius:14px;
  padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.pwa-banner-icon{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(184,136,42,.15),rgba(184,136,42,.05));
  border:1px solid rgba(184,136,42,.3);
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Serif Display',serif;font-size:18px;color:#B8882A;
}
.pwa-banner-text{flex:1;min-width:0}
.pwa-banner-title{font-size:14px;font-weight:600;color:#E8E4D8}
.pwa-banner-sub{font-size:11px;color:#97948B;margin-top:2px;line-height:1.4}
.pwa-banner-btn{
  padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;
  background:linear-gradient(135deg,#B8882A,#C9962A);color:#07090C;
  border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.pwa-banner-btn:hover{filter:brightness(1.1)}
.pwa-banner-close{
  font-size:18px;color:#97948B;background:none;border:none;cursor:pointer;
  padding:4px 8px;flex-shrink:0;line-height:1;
}
/* iOS standalone padding */
.ios-standalone .mobtab{padding-bottom:calc(6px + 20px)}
.ios-standalone .fab{bottom:calc(84px + 20px)}
.ios-standalone .main{padding-bottom:120px!important}
@media(min-width:981px){
  .pwa-banner{bottom:24px}
}
